<!-- An affliction the creature has (afflictions.js): its stage, which the GM
     can change, what comes next, and buttons for its save and for applying
     the stage shown (after an onset, or a stage typed in). -->
<div style="display: flex; flex-direction: column; width: 100%">
  <div style="display: flex; gap: 4px; align-items: center; width: 100%">
    <div style="flex: 1; min-width: 100px">
      <namefield field="namefield" width="100%" size="xs"></namefield>
    </div>
    <span class="rvtt-sheet-mono-dim">STAGE</span>
    <numberfield
      field="stage"
      size="xs"
      width="44px"
      hidecontrols="true"
      textalign="center"
      minvalue="0"
    ></numberfield>
    <iconbutton
      size="sm"
      variant="subtle"
      options='[{"icon": "D20", "label": "Roll the Save", "value": "save"}]'
      field="afflictionSaveBtn"
      onclick="rollAfflictionSaveFromRow(dataPath)"
    ></iconbutton>
    <iconbutton
      size="sm"
      variant="subtle"
      options='[{"icon": "IconPlayerPlay", "label": "Apply This Stage", "value": "apply"}]'
      field="afflictionApplyBtn"
      onclick="applyAfflictionStageFromRow(dataPath)"
    ></iconbutton>
  </div>
  <label field="status" size="xs" color="dimmed" hideifempty="true"></label>
</div>
