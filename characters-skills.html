<script>
  function performSkillCheck(skill) {
    rollSkill(record, skill);
  }

  // "Roll as..." menu: roll the skill as one of its actions (Demoralize,
  // Trip...), then clear the menu so the same action can be picked again
  function performSkillActionFromSheet(skill, actionName) {
    if (!actionName) return;
    api.setValue(`data.rollAs${skill.charAt(0).toUpperCase()}${skill.slice(1)}`, "");
    performSkillAction(record, skill, actionName);
  }

  function onSkillTrainingChange(value, skill) {
    onAddEditFeature(record);
  }

  function onSkillAbilityChange() {
    onAddEditFeature(record);
  }

  // Automatic Bonus Progression: choose every skill potency pick again
  function chooseAbpSkillPotency() {
    const level = parseInt(record.data?.level || "1", 10);
    const picks = getAbpSkillPicksUpToLevel(level);
    if (picks.length === 0) {
      api.showNotification(
        "Skill potency starts at a higher level.",
        "yellow",
        "Skill Potency",
      );
      return;
    }
    api.setValues({ "data.abpSkillPotency": {} }, () => {
      const choose = (index) => {
        if (index >= picks.length) {
          api.getRecord("characters", record._id, (updatedRecord) => {
            onAddEditFeature(updatedRecord);
          });
          return;
        }
        promptAbpSkillPotency(record._id, picks[index].level, picks[index], () =>
          choose(index + 1),
        );
      };
      choose(0);
    });
  }
</script>
