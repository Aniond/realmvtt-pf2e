<script>
  // The GM Tools panel (View menu, GM only): the encounter builder (H21,
  // gm-tools.js), then treasure, reputation and downtime (campaign-tools.js).
  // Its fields are campaign variables; each action writes what it changed and
  // its meter (encounterMeter, treasureMeter, reputationMeter), which the
  // labels below read. The party's level and size are shared.
  function onEncounterPartyLevel(value) {
    setEncounterBuilderParty("level", value);
    const level = parseInt(value, 10);
    if (Number.isFinite(level)) refreshTreasureMeter({ level });
  }

  function onEncounterPartySize(value) {
    setEncounterBuilderParty("size", value);
    const size = parseInt(value, 10);
    if (Number.isFinite(size)) refreshTreasureMeter({ size });
  }
</script>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 6px">
  <div
    class="rvtt-sheet-section rvtt-sheet-corners"
    style="background: var(--bg, transparent)"
  >
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tr"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--bl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--br"></span>

    <div class="rvtt-sheet-divider">
      <span class="rvtt-sheet-divider__label"
        >&#10022; Encounter Builder &#10022;</span
      >
    </div>

    <!-- The party -->
    <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap">
      <span class="rvtt-sheet-mono-dim">PARTY LVL</span>
      <numberfield
        field="encounterPartyLevel"
        size="xs"
        hidecontrols="true"
        width="44px"
        placeholder="1"
        minvalue="1"
        onchange="onEncounterPartyLevel(value)"
      ></numberfield>
      <span class="rvtt-sheet-mono-dim">SIZE</span>
      <numberfield
        field="encounterPartySize"
        size="xs"
        hidecontrols="true"
        width="44px"
        placeholder="4"
        minvalue="1"
        onchange="onEncounterPartySize(value)"
      ></numberfield>
      <div style="flex: 1"></div>
      <button
        size="xs"
        variant="light"
        icon="IconUsers"
        label="Use the Party"
        onclick="setEncounterBuilderFromParty()"
      ></button>
    </div>

    <!-- The meter: the XP against Extreme's budget, the threat, the next one -->
    <div style="margin-top: 10px">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          margin-bottom: 4px;
        "
      >
        <label field="encounterMeter.xpLabel" size="lg" variant="bold"></label>
        <label
          field="encounterMeter.threat"
          size="lg"
          variant="bold"
          color="orange"
        ></label>
      </div>
      <progressbar
        field="encounterMeter"
        currentvaluefield="encounterMeter.xp"
        maxvaluefield="encounterMeter.max"
        color="orange"
        size="md"
      ></progressbar>
      <div style="display: flex; gap: 4px; margin-top: 4px">
        <label field="encounterMeter.next" size="xs" color="dimmed" hideifempty="true"></label>
      </div>
    </div>

    <!-- The budgets for the party's size -->
    <div
      style="
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        margin-top: 8px;
        text-align: center;
      "
    >
      <div>
        <span class="rvtt-sheet-mono-dim">TRIVIAL</span>
        <label field="encounterMeter.budgets.Trivial" size="sm" textalign="center"></label>
      </div>
      <div>
        <span class="rvtt-sheet-mono-dim">LOW</span>
        <label field="encounterMeter.budgets.Low" size="sm" textalign="center"></label>
      </div>
      <div>
        <span class="rvtt-sheet-mono-dim">MODERATE</span>
        <label field="encounterMeter.budgets.Moderate" size="sm" textalign="center"></label>
      </div>
      <div>
        <span class="rvtt-sheet-mono-dim">SEVERE</span>
        <label field="encounterMeter.budgets.Severe" size="sm" textalign="center"></label>
      </div>
      <div>
        <span class="rvtt-sheet-mono-dim">EXTREME</span>
        <label field="encounterMeter.budgets.Extreme" size="sm" textalign="center"></label>
      </div>
    </div>

    <!-- The creatures: a row for each kind, empty rows hidden -->
    <div class="rvtt-sheet-divider" style="margin-top: 10px">
      <span class="rvtt-sheet-divider__label">&#10022; Creatures &#10022;</span>
    </div>
    <label field="encounterMeter.empty" size="sm" color="dimmed" hideifempty="true"></label>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.0.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.0.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.1.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.1.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.2.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.2.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.3.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.3.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.4.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.4.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.5.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.5.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.6.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.6.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.7.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.7.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.8.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.8.xp" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="encounterMeter.rows.9.name" size="sm" hideifempty="true"></label>
      <label field="encounterMeter.rows.9.xp" size="sm" hideifempty="true"></label>
    </div>

    <!-- The actions -->
    <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px">
      <button
        size="xs"
        variant="light"
        icon="IconPlus"
        label="Add Selected"
        onclick="addSelectedToEncounterBuilder()"
      ></button>
      <button
        size="xs"
        variant="light"
        icon="IconStairs"
        label="Add by Level"
        onclick="addLevelToEncounterBuilder()"
      ></button>
      <button
        size="xs"
        variant="light"
        icon="IconArrowBackUp"
        label="Remove Last"
        onclick="removeLastFromEncounterBuilder()"
      ></button>
      <button
        size="xs"
        variant="light"
        icon="IconTrash"
        label="Clear"
        onclick="clearEncounterBuilder()"
      ></button>
      <button
        size="xs"
        variant="light"
        icon="IconLayoutList"
        label="Templates"
        onclick="promptEncounterTemplates()"
      ></button>
    </div>
  </div>

  <div
    class="rvtt-sheet-section rvtt-sheet-corners"
    style="background: var(--bg, transparent)"
  >
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tr"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--bl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--br"></span>

    <div class="rvtt-sheet-divider">
      <span class="rvtt-sheet-divider__label">&#10022; Treasure &#10022;</span>
    </div>

    <!-- Awarded against the level's budget (the party above) -->
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      "
    >
      <label field="treasureMeter.awardedLabel" size="lg" variant="bold" hideifempty="true"></label>
      <label field="treasureMeter.left" size="sm" color="orange" hideifempty="true"></label>
    </div>
    <progressbar
      field="treasureMeter"
      currentvaluefield="treasureMeter.awarded"
      maxvaluefield="treasureMeter.max"
      color="yellow"
      size="md"
    ></progressbar>
    <label field="treasureMeter.budgetLabel" size="xs" color="dimmed" hideifempty="true"></label>
    <label field="treasureMeter.permanent" size="sm" hideifempty="true"></label>
    <label field="treasureMeter.consumables" size="sm" hideifempty="true"></label>
    <label field="treasureMeter.currency" size="sm" hideifempty="true"></label>
    <label field="treasureMeter.abp" size="xs" color="dimmed" hideifempty="true"></label>

    <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px">
      <button
        size="xs"
        variant="light"
        icon="IconCoins"
        label="Add Award"
        onclick="addTreasureAward()"
      ></button>
      <button
        size="xs"
        variant="light"
        icon="IconStairsUp"
        label="New Level"
        onclick="startTreasureLevel()"
      ></button>
      <button
        size="xs"
        variant="light"
        icon="IconRefresh"
        label="Show Budget"
        onclick="refreshTreasureMeter()"
      ></button>
    </div>
  </div>

  <div
    class="rvtt-sheet-section rvtt-sheet-corners"
    style="background: var(--bg, transparent)"
  >
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tr"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--bl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--br"></span>

    <div class="rvtt-sheet-divider">
      <span class="rvtt-sheet-divider__label">&#10022; Reputation &#10022;</span>
    </div>

    <!-- A row for each faction, empty rows hidden -->
    <label field="reputationMeter.empty" size="sm" color="dimmed" hideifempty="true"></label>
    <div style="display: flex; justify-content: space-between">
      <label field="reputationMeter.rows.0.name" size="sm" hideifempty="true"></label>
      <label field="reputationMeter.rows.0.standing" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="reputationMeter.rows.1.name" size="sm" hideifempty="true"></label>
      <label field="reputationMeter.rows.1.standing" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="reputationMeter.rows.2.name" size="sm" hideifempty="true"></label>
      <label field="reputationMeter.rows.2.standing" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="reputationMeter.rows.3.name" size="sm" hideifempty="true"></label>
      <label field="reputationMeter.rows.3.standing" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="reputationMeter.rows.4.name" size="sm" hideifempty="true"></label>
      <label field="reputationMeter.rows.4.standing" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="reputationMeter.rows.5.name" size="sm" hideifempty="true"></label>
      <label field="reputationMeter.rows.5.standing" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="reputationMeter.rows.6.name" size="sm" hideifempty="true"></label>
      <label field="reputationMeter.rows.6.standing" size="sm" hideifempty="true"></label>
    </div>
    <div style="display: flex; justify-content: space-between">
      <label field="reputationMeter.rows.7.name" size="sm" hideifempty="true"></label>
      <label field="reputationMeter.rows.7.standing" size="sm" hideifempty="true"></label>
    </div>

    <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px">
      <button
        size="xs"
        variant="light"
        icon="IconPlus"
        label="Add Faction"
        onclick="addReputationFaction()"
      ></button>
      <button
        size="xs"
        variant="light"
        icon="IconArrowsUpDown"
        label="Favor or Disservice"
        onclick="changeReputation()"
      ></button>
      <button
        size="xs"
        variant="light"
        icon="IconTrash"
        label="Remove Faction"
        onclick="removeReputationFaction()"
      ></button>
    </div>
  </div>

  <div
    class="rvtt-sheet-section rvtt-sheet-corners"
    style="background: var(--bg, transparent)"
  >
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tr"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--bl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--br"></span>

    <div class="rvtt-sheet-divider">
      <span class="rvtt-sheet-divider__label">&#10022; Downtime &#10022;</span>
    </div>
    <div style="display: flex; gap: 4px; flex-wrap: wrap">
      <button
        size="xs"
        variant="light"
        icon="IconCalendarPlus"
        label="Grant Downtime Days"
        onclick="grantDowntimeDays()"
      ></button>
    </div>
  </div>
</div>
