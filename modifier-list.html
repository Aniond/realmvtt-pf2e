<script>
  function showHideFields() {
    const modPath = dataPath.replace(".data.type", "");
    const modifier = api.getValue(modPath);
    const typeValue = modifier?.data?.type || "";

    const valuesToSet = {};

    if (
      (typeValue.includes("Bonus") || typeValue.includes("Penalty")) &&
      modifier.fields?.modifierType?.hidden !== false
    ) {
      valuesToSet[`${modPath}.fields.modifierType.hidden`] = false;
    } else if (
      !typeValue.includes("Bonus") &&
      !typeValue.includes("Penalty") &&
      modifier.fields?.modifierType?.hidden !== true
    ) {
      valuesToSet[`${modPath}.fields.modifierType.hidden`] = true;
    }

    let showFieldField = true;
    let showAttributeField = false;
    let showSkillField = false;
    let showAttackField = false;
    let showSaveField = false;
    let showAllChecksField = false;
    let showValueField = true;
    let showAdjustDegreeOfSuccessField = false;
    let showAdjustModifierField = false;
    let showActiveEffectField = false;
    let showRollOptionField = false;
    let showIWRField = false;
    let showRollNoteField = false;

    if (typeValue === "attributeBonus") {
      showAttributeField = true;
      showFieldField = false;
    } else if (typeValue === "attributePenalty") {
      showAttributeField = true;
      showFieldField = false;
    } else if (typeValue === "attackBonus") {
      showFieldField = false;
      showAttackField = true;
    } else if (typeValue === "attackPenalty") {
      showFieldField = false;
      showAttackField = true;
    } else if (typeValue === "damageBonus") {
      showFieldField = false;
      showAttackField = true;
    } else if (typeValue === "damagePenalty") {
      showAttackField = true;
      showFieldField = false;
    } else if (typeValue === "skillBonus") {
      showFieldField = false;
      showSkillField = true;
    } else if (typeValue === "skillPenalty") {
      showFieldField = false;
      showSkillField = true;
    } else if (typeValue === "saveBonus") {
      showFieldField = false;
      showSaveField = true;
    } else if (typeValue === "savePenalty") {
      showFieldField = false;
      showSaveField = true;
    } else if (typeValue === "allBonus") {
      showAllChecksField = true;
      showFieldField = false;
    } else if (typeValue === "allPenalty") {
      showAllChecksField = true;
      showFieldField = false;
    } else if (typeValue === "adjustDegreeOfSuccess") {
      showFieldField = false;
      showAdjustDegreeOfSuccessField = true;
      showValueField = false;
    } else if (typeValue === "adjustModifier") {
      showFieldField = false;
      showAdjustModifierField = true;
      showValueField = true;
    } else if (typeValue === "activeEffect") {
      showFieldField = false;
      showValueField = false;
      showActiveEffectField = true;
    } else if (typeValue === "speedBonus" || typeValue === "speedPenalty") {
      // Flat speed adjustment (e.g., Nimble Elf +5 status bonus to Speed).
      // Field: empty for land Speed, or fly/swim/climb/burrow
      showFieldField = true;
    } else if (typeValue === "speed") {
      // Grants a movement type: field fly/swim/climb/burrow, value feet or
      // "land" (equal to your land Speed)
      showFieldField = true;
    } else if (
      typeValue === "weaponDieSize" ||
      typeValue === "weaponTrait" ||
      typeValue === "dexCap" ||
      typeValue === "dyingMax" ||
      typeValue === "recoveryDC" ||
      typeValue === "weaponRange" ||
      typeValue === "weaponRune" ||
      typeValue === "weaponDamageType" ||
      typeValue === "weaponMaterial" ||
      typeValue === "spellDamageType" ||
      typeValue === "rangeIncrementPenalty" ||
      typeValue === "offGuardTarget"
    ) {
      showFieldField = false;
    } else if (typeValue === "rollTwice") {
      // Value: keep-higher (fortune) or keep-lower (misfortune). Field: the
      // roll (skill, save, attack-roll...), or empty for every roll
      showFieldField = true;
    } else if (typeValue === "bulkLimit") {
      showFieldField = false;
    } else if (typeValue === "conditionGain") {
      // Field: the condition's name, as its effect is named (Frightened).
      // Value: the change to a value gained (-1)
      showFieldField = true;
    } else if (typeValue === "weaponProficiency") {
      // Weapon proficiency uses predicate to match weapons, value is the rank (1=trained, 2=expert, etc.)
      showFieldField = false;
      showValueField = true;
    } else if (typeValue === "rollOption") {
      // Roll option adds a trait to the character if predicate passes
      showFieldField = false;
      showValueField = false;
      showRollOptionField = true;
    } else if (
      typeValue === "resistance" ||
      typeValue === "weakness" ||
      typeValue === "immunity"
    ) {
      // Field: the damage type (Physical is bludgeoning, piercing and
      // slashing). Exceptions and definition read where the damage comes from.
      showIWRField = true;
    } else if (typeValue === "suppressIWR") {
      // Field: immunity, resistance, weakness, all, or empty for immunity and
      // resistance. Value: the damage types, comma-separated (vitality,void)
      showFieldField = true;
    } else if (typeValue === "persistentRecoveryDC") {
      // Field: the persistent damage type (fire), or empty for all. Value:
      // the DC (10), or a change to it (-5)
      showFieldField = true;
    } else if (typeValue === "harmedBy" || typeValue === "restHealing") {
      // Harmed By value: vitality or void. Overnight Rest Healing value: the
      // Hit Points added (@actor.level)
      showFieldField = false;
    } else if (
      typeValue === "voidHealing" ||
      typeValue === "maximizeHealing"
    ) {
      // No field or value; gate with the predicate (item:slug:...)
      showFieldField = false;
      showValueField = false;
    } else if (typeValue === "rollNote") {
      // Field: the roll (will, saving-throw, athletics, skill-check,
      // attack-roll). Value: the note's text.
      showFieldField = true;
      showRollNoteField = true;
    }

    // Critical-hit-only applies to damage riders
    const showCriticalField =
      typeValue === "damageBonus" || typeValue === "damagePenalty";
    if (modifier.fields?.critical?.hidden !== !showCriticalField) {
      valuesToSet[`${modPath}.fields.critical.hidden`] = !showCriticalField;
    }
    if (modifier.fields?.failureOnly?.hidden !== !showCriticalField) {
      valuesToSet[`${modPath}.fields.failureOnly.hidden`] = !showCriticalField;
    }

    if (modifier.fields?.value?.hidden !== !showValueField) {
      valuesToSet[`${modPath}.fields.value.hidden`] = !showValueField;
      valuesToSet[`${modPath}.fields.valueType.hidden`] = !showValueField;
    }
    if (modifier.fields?.field?.hidden !== !showFieldField) {
      valuesToSet[`${modPath}.fields.field.hidden`] = !showFieldField;
    }
    if (modifier.fields?.fieldAttribute?.hidden !== !showAttributeField) {
      valuesToSet[`${modPath}.fields.fieldAttribute.hidden`] =
        !showAttributeField;
    }
    if (modifier.fields?.fieldSkill?.hidden !== !showSkillField) {
      valuesToSet[`${modPath}.fields.fieldSkill.hidden`] = !showSkillField;
    }
    if (modifier.fields?.fieldAttack?.hidden !== !showAttackField) {
      valuesToSet[`${modPath}.fields.fieldAttack.hidden`] = !showAttackField;
    }
    if (modifier.fields?.fieldSave?.hidden !== !showSaveField) {
      valuesToSet[`${modPath}.fields.fieldSave.hidden`] = !showSaveField;
    }
    if (modifier.fields?.fieldAllChecks?.hidden !== !showAllChecksField) {
      valuesToSet[`${modPath}.fields.fieldAllChecks.hidden`] =
        !showAllChecksField;
    }
    if (modifier.fields?.value?.hidden !== !showValueField) {
      valuesToSet[`${modPath}.fields.value.hidden`] = !showValueField;
    }
    if (
      modifier.fields?.adjustDegreeOfSuccessBox?.hidden !==
      !showAdjustDegreeOfSuccessField
    ) {
      valuesToSet[`${modPath}.fields.adjustDegreeOfSuccessBox.hidden`] =
        !showAdjustDegreeOfSuccessField;
    }
    if (
      modifier.fields?.adjustModifierBox?.hidden !== !showAdjustModifierField
    ) {
      valuesToSet[`${modPath}.fields.adjustModifierBox.hidden`] =
        !showAdjustModifierField;
    }
    if (modifier.fields?.activeEffectBox?.hidden !== !showActiveEffectField) {
      valuesToSet[`${modPath}.fields.activeEffectBox.hidden`] =
        !showActiveEffectField;
    }
    if (modifier.fields?.rollOptionBox?.hidden !== !showRollOptionField) {
      valuesToSet[`${modPath}.fields.rollOptionBox.hidden`] =
        !showRollOptionField;
    }
    if (modifier.fields?.iwrBox?.hidden !== !showIWRField) {
      valuesToSet[`${modPath}.fields.iwrBox.hidden`] = !showIWRField;
    }
    if (modifier.fields?.rollNoteBox?.hidden !== !showRollNoteField) {
      valuesToSet[`${modPath}.fields.rollNoteBox.hidden`] = !showRollNoteField;
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function setField(value) {
    const modPath = getNearestParentDataPath(dataPath);
    const modifier = api.getValue(modPath);
    const typeValue = modifier?.data?.type || "";

    const valuesToSet = {
      [`${modPath}.data.field`]: value,
    };

    api.setValues(valuesToSet);
  }
</script>

<box field="activeEffectBox" hidden="true">
  <stringfield
    width="100%"
    size="xs"
    field="effectField"
    label="Field Path"
    placeholder="Enter field path (e.g., flags.pf2e.inventor.explode)"
  ></stringfield>

  <stringfield
    width="100%"
    size="xs"
    field="effectValue"
    label="Value"
    placeholder="Enter value to set"
  ></stringfield>

  <dropdown
    width="100%"
    size="xs"
    field="effectMode"
    label="Mode"
    placeholder="Select Mode"
    defaultvalue="override"
    options='[{"label": "Override (replace value)", "value": "override"},
      {"label": "Upgrade (use higher value)", "value": "upgrade"},
      {"label": "Add (sum values)", "value": "add"},
      {"label": "Multiply (multiply values)", "value": "multiply"},
      {"label": "Append (add to array)", "value": "append"},
      {"label": "Remove (remove from array)", "value": "remove"}]'
  ></dropdown>
</box>

<box field="rollOptionBox" hidden="true">
  <stringfield
    width="100%"
    size="xs"
    field="option"
    label="Option (Trait to Add)"
    placeholder="Enter trait to add when predicate passes (e.g., junction:air:impulse)"
  ></stringfield>
</box>

<box field="iwrBox" hidden="true">
  <stringfield
    width="100%"
    size="xs"
    field="exceptions"
    label="Exceptions"
    placeholder='Optional: damage types, traits or materials (force, adamantine), or [{"definition":["item:category:unarmed"]}]'
  ></stringfield>

  <stringfield
    width="100%"
    size="xs"
    field="definition"
    label="Applies Only To (Definition)"
    placeholder='Optional predicate on the damage source, e.g. ["origin:mode:undead"] or ["item:type:spell","item:trait:arcane"]'
    multiline="true"
  ></stringfield>
</box>

<box field="rollNoteBox" hidden="true">
  <stringfield
    width="100%"
    size="xs"
    field="outcome"
    label="Show On Outcomes"
    placeholder="Optional: criticalSuccess, success, failure, criticalFailure (empty = all)"
  ></stringfield>
</box>

<stringfield
  width="100%"
  size="xs"
  field="slug"
  label="Slug (optional identifier)"
  placeholder="Enter unique slug for this modifier (e.g., weapon-specialization)"
></stringfield>

<stringfield
  width="100%"
  size="xs"
  field="predicate"
  label="Predicate"
  placeholder='Enter optional predicate, e.g. or(["trait:fire","trait:cold"])'
  multiline="true"
></stringfield>
