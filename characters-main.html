<script>
  function onDrop(type, recordLink) {
    if (type === "ancestry") {
      onDropAncestry(recordLink);
    } else if (type === "heritage") {
      onDropHeritage(record, recordLink);
    } else if (type === "class") {
      onDropClass(recordLink);
    } else if (type === "backgrounds") {
      onDropBackground(recordLink);
    }
  }

  function onDropAncestry(recordLink) {
    // Check if already on Character
    const ancestries = record?.data?.ancestries || [];
    const ancestryName = recordLink.tooltip;
    const ancestryObj = { ...recordLink.value };

    // Add all non-rarity traits to the character
    const traits = ancestryObj.data?.traits || [];
    const nonRarityTraits = traits.filter((trait) => !getIsTraitRarity(trait));
    ancestryObj.data.traits = nonRarityTraits;

    // Set traits list
    const traitsObjects = [];
    for (const trait of nonRarityTraits) {
      traitsObjects.push({
        _id: generateUuid(),
        name: trait,
        identified: true,
        data: {},
      });
    }

    const curTraits = record.data?.traits || [];
    // Ensure uniqueness by using a Set for better deduplication
    const newTraits = [...new Set([...curTraits, ...nonRarityTraits])];

    const curTraitsList = record.data?.traitsList || [];
    // Ensure uniqueness by name, keeping the first occurrence of each trait name
    const newTraitsList = [...curTraitsList, ...traitsObjects].filter(
      (trait, index, self) =>
        self.findIndex((t) => t.name === trait.name) === index,
    );

    api.setValues(
      {
        "data.ancestries": [ancestryObj],
        "data.ancestryName": ancestryName,
        "data.size": ancestryObj.data?.size,
        "data.senses": ancestryObj.data?.vision,
        "data.speed": ancestryObj.data?.speed,
        "data.traitsList": newTraitsList,
        "data.traits": newTraits,
        "data.reach": ancestryObj.data?.reach,
        // Default to false on add of ancestry
        "data.alternateAncestryBoosts": false,
      },
      (updatedRecord) => {
        // Show ancestry UI, then prompt for heritage
        // onAddEditFeature will be called after heritage is selected
        api.setHidden("ancestries", false, () => {
          api.setHidden("ancestryDetailsLabel", true);
        });
        promptForHeritage(updatedRecord, ancestryName);
      },
    );
  }

  function updateLanguages(value) {
    setLanguages(value);
  }

  function promptForHeritage(record, ancestryName) {
    const optionsPrompt = {
      type: "heritage",
      query: {
        $or: [{ "data.ancestry": ancestryName }, { "data.versatile": "yes" }],
      },
    };

    const onSelect = (choices) => {
      const choice = choices && choices.length > 0 ? choices[0] : null;
      if (choice) {
        // Add the heritage to the character, then call the callback
        onDropHeritage(record, {
          tooltip: choice.name,
          value: choice,
        });
      }
    };

    api.showPrompt(
      "Heritage",
      "Select a Heritage",
      "Select Heritage...",
      [],
      optionsPrompt,
      onSelect,
    );
  }

  function onDropHeritage(record, recordLink) {
    // Check if already on Character
    const heritages = record?.data?.heritages || [];
    const heritageName = recordLink.tooltip;
    const heritageObj = { ...recordLink.value };

    // Add all non-rarity traits to the character
    const traits = heritageObj.data?.traits || [];
    const nonRarityTraits = traits.filter((trait) => !getIsTraitRarity(trait));
    heritageObj.data.traits = nonRarityTraits;

    // Set traits list
    const traitsObjects = [];
    for (const trait of nonRarityTraits) {
      traitsObjects.push({
        _id: generateUuid(),
        name: trait,
        identified: true,
        data: {},
      });
    }

    const curTraits = record.data?.traits || [];
    // Ensure uniqueness by using a Set for better deduplication
    const newTraits = [...new Set([...curTraits, ...nonRarityTraits])];

    const curTraitsList = record.data?.traitsList || [];
    // Ensure uniqueness by name, keeping the first occurrence of each trait name
    const newTraitsList = [...curTraitsList, ...traitsObjects].filter(
      (trait, index, self) =>
        self.findIndex((t) => t.name === trait.name) === index,
    );

    api.setValuesOnRecord(
      record,
      {
        "data.heritages": [heritageObj],
        "data.heritageName": heritageName,
        "data.traitsList": newTraitsList,
        "data.traits": newTraits,
      },
      (updatedRecord2) => {
        // Recalculate ability scores for bonuses and such
        onAddEditFeature(updatedRecord2, () => {
          api.setHidden("heritages", false, () => {
            api.setHidden("heritageDetailsLabel", true);
          });
        });
      },
    );
  }

  function onDropClass(recordLink) {
    // Check if already on Character
    const classes = record?.data?.classes || [];
    const className = recordLink.tooltip;
    const classObj = { ...recordLink.value };

    // Add all non-rarity traits to the character
    const traits = classObj.data?.traits || [];
    const nonRarityTraits = traits.filter((trait) => !getIsTraitRarity(trait));
    classObj.data.traits = nonRarityTraits;

    // Set traits list
    const traitsObjects = [];
    for (const trait of nonRarityTraits) {
      traitsObjects.push({
        _id: generateUuid(),
        name: trait,
        identified: true,
        data: {},
      });
    }

    const curTraits = record.data?.traits || [];
    // Ensure uniqueness by using a Set for better deduplication
    const newTraits = [...new Set([...curTraits, ...nonRarityTraits])];

    const curTraitsList = record.data?.traitsList || [];
    // Ensure uniqueness by name, keeping the first occurrence of each trait name
    const newTraitsList = [...curTraitsList, ...traitsObjects].filter(
      (trait, index, self) =>
        self.findIndex((t) => t.name === trait.name) === index,
    );

    api.setValues(
      {
        "data.level": record.data?.level || 1, // Set level to 1 if not set
        "data.classes": [classObj],
        "data.className": className,
        "data.traitsList": newTraitsList,
        "data.traits": newTraits,
        "data.keyAbility":
          classObj.data?.keyAbility?.length > 0
            ? classObj.data?.keyAbility[0]
            : "none",
        // The class's spellcasting entries are made from now on, its focus
        // entry too
        "data.autoSpellcasting": true,
        "data.autoFocusSpellcasting": true,
        // Shown again if the Level 0 creation wizard hid it
        "fields.keyAbility.hidden": false,
      },
      (updatedRecord) => {
        // Recalculate ability scores for bonuses and such
        onAddEditFeature(updatedRecord, () => {
          api.setHidden("classes", false, () => {
            api.setHidden("classDetailsLabel", true);
          });
        });
      },
    );
  }

  function onDropBackground(recordLink) {
    // Check if already on Character
    const backgrounds = record?.data?.backgrounds || [];
    const backgroundName = recordLink.tooltip;
    const backgroundObj = { ...recordLink.value };

    // Add all non-rarity traits to the character
    const traits = backgroundObj.data?.traits || [];
    const nonRarityTraits = traits.filter((trait) => !getIsTraitRarity(trait));
    backgroundObj.data.traits = nonRarityTraits;

    // Set traits list
    const traitsObjects = [];
    for (const trait of nonRarityTraits) {
      traitsObjects.push({
        _id: generateUuid(),
        name: trait,
        identified: true,
        data: {},
      });
    }

    const curTraits = record.data?.traits || [];
    // Ensure uniqueness by using a Set for better deduplication
    const newTraits = [...new Set([...curTraits, ...nonRarityTraits])];

    const curTraitsList = record.data?.traitsList || [];
    // Ensure uniqueness by name, keeping the first occurrence of each trait name
    const newTraitsList = [...curTraitsList, ...traitsObjects].filter(
      (trait, index, self) =>
        self.findIndex((t) => t.name === trait.name) === index,
    );

    api.setValues(
      {
        "data.backgrounds": [backgroundObj],
        "data.backgroundName": backgroundName,
        "data.traitsList": newTraitsList,
        "data.traits": newTraits,
      },
      (updatedRecord) => {
        // Recalculate ability scores for bonuses and such
        onAddEditFeature(updatedRecord, () => {
          api.setHidden("backgrounds", false, () => {
            api.setHidden("backgroundDetailsLabel", true);
          });
        });
      },
    );
  }

  function onDeleteAncestry() {
    // Recalculate ability scores for bonuses and such
    onAddEditFeature(
      record,
      () => {
        api.setHidden("ancestries", true, () => {
          api.setHidden("ancestryDetailsLabel", false);
        });
      },
      // Skip choice processing
      true,
    );
  }

  function onDeleteHeritage() {
    // Recalculate ability scores for bonuses and such
    onAddEditFeature(
      record,
      () => {
        api.setHidden("heritages", true, () => {
          api.setHidden("heritageDetailsLabel", false);
        });
      },
      // Skip choice processing
      true,
    );
  }

  function onDeleteClass() {
    // Remove all unused feat slots
    const feats = record.data?.feats || [];
    const remainingFeats = feats.filter((feat) => feat.data?.type !== "slot");
    api.setValues(
      {
        "data.feats": remainingFeats,
      },
      (updatedRecord) => {
        // Recalculate ability scores for bonuses and such
        onAddEditFeature(
          updatedRecord,
          () => {
            api.setHidden("classes", true, () => {
              api.setHidden("classDetailsLabel", false);
            });
          },
          // Skip choice processing
          true,
        );
      },
    );
  }

  function onDeleteBackground() {
    // Recalculate ability scores for bonuses and such
    onAddEditFeature(
      record,
      () => {
        api.setHidden("backgrounds", true, () => {
          api.setHidden("backgroundDetailsLabel", false);
        });
      },
      // Skip choice processing
      true,
    );
  }

  function onLoadCharacter() {
    // Check if we need to show/hide the level up button
    // If we're not doing a change to boost fields, check if we need to show/hide the level up button
    if (
      record.data?.xp >= getXpToNextLevel(record) &&
      record.data?.level < 20 &&
      record.fields?.levelUpBtn?.hidden !== false
    ) {
      api.setHidden("levelUpBtn", false);
    } else if (record.fields?.levelUpBtn?.hidden !== true) {
      api.setHidden("levelUpBtn", true);
    }

    // If this is the first time we're loading the character, add the unarmed attack
    if (!record.data?.initialized) {
      api.setValue("data.initialized", true, () => {
        api.addValue("data.inventory", {
          _id: generateUuid(),
          portrait: "/images/bc390eaa-d17a-4022-a1ca-fa388c12e498_29.webp",
          name: "Unarmed Strike",
          recordType: "items",
          identified: true,
          unidentifiedName: "Unarmed Strike",
          fields: {
            armorCategory: {
              hidden: true,
            },
            armorProperties: {
              hidden: true,
            },
            backpackProperties: {
              hidden: true,
            },
            consumableCategory: {
              hidden: true,
            },
            consumableProperties: {
              hidden: true,
            },
            equipmentCategory: {
              hidden: true,
            },
            kitProperties: {
              hidden: true,
            },
            levelLabel: {
              hidden: true,
            },
            otherProperties: {
              hidden: false,
            },
            scrollProperties: {
              hidden: true,
            },
            shieldProperties: {
              hidden: true,
            },
            weaponCategory: {
              hidden: false,
            },
            weaponProperties: {
              hidden: false,
            },
            dropBtn: {
              hidden: true,
            },
            stowBtn: {
              hidden: true,
            },
          },
          data: {
            carried: "equipped",
            traits: ["Attack", "Agile", "Finesse", "Nonlethal", "Unarmed"],
            hideFromList: "true",
            traitsList: [
              {
                _id: "790b41f3-3ff0-492a-ab40-0cc345da882d",
                name: "Attack",
                identified: true,
                data: {},
              },
              {
                _id: "21c049b5-a20f-4ca0-95de-cc51a6265d27",
                name: "Agile",
                identified: true,
                data: {},
              },
              {
                _id: "cb9e0428-22fe-4baa-930e-1f1d26625f53",
                name: "Finesse",
                identified: true,
                data: {},
              },
              {
                _id: "b988644b-5cbd-4b0a-bf85-c34a040c4a75",
                name: "Nonlethal",
                identified: true,
                data: {},
              },
              {
                _id: "088ba422-e9c7-4885-9661-5a0fca3e47aa",
                name: "Unarmed",
                identified: true,
                data: {},
              },
            ],
            type: "weapon",
            level: 0,
            bulk: {
              value: 0,
            },
            itemCategory: "Unarmed",
            group: "Brawling",
            damage: {
              dice: 1,
              die: "d4",
              damageType: "bludgeoning",
            },
          },
          locked: true,
        });
      });
    }

    // A GM may turn variant rules on or off after this character was built
    // (Free Archetype or Ancestry Paragon on a character who already leveled
    // up): recalculate once so the new feat slots, panels and totals show.
    // Only the GM or the character's owner can save that; for anyone else
    // viewing the sheet it would fail and be tried again on every open.
    if (
      (record.data?.variantRulesKey || "") !== getVariantRulesKey() &&
      canEditRecord(record)
    ) {
      const oldFeats = record.data?.feats || [];
      onAddEditFeature(
        record,
        () => {
          api.getRecord("characters", record._id, (updatedRecord) => {
            const message = describeNewFeatSlots(
              oldFeats,
              updatedRecord.data?.feats || [],
            );
            if (message) {
              api.showNotification(message, "blue", "Feats");
            }
          });
        },
        true,
      );
    }
  }

  function onLevelChange(value) {
    // Show the boost sets this level has reached and drop boosts above it
    // (Gradual Ability Boosts fills a set one level at a time)
    const valuesToSet = getFreeBoostFieldsForLevel(
      record,
      parseInt(value || "0", 10),
    );

    api.setValues(valuesToSet, (updatedRecord) => {
      // Update everything using the new level, prompting for choices if
      // needed
      onAddEditFeature(updatedRecord);
    });
  }

  function onXPChange(value) {
    if (value >= getXpToNextLevel(record) && record.data?.level < 20) {
      api.setHidden("levelUpBtn", false);
    } else {
      api.setHidden("levelUpBtn", true);
    }
  }

  function onLevelUp() {
    // Level 0 Characters take a class on reaching 1st level
    if (isLevelZeroCharacter(record)) {
      levelUpFromZero();
      return;
    }
    const currentLevel = parseInt(record.data?.level || "1", 10);
    if (currentLevel >= 20) {
      return;
    }
    const newLevel = currentLevel + 1;
    const gains = getLevelUpGains(record, newLevel);

    api.showConfirm(
      `Level Up to ${newLevel}`,
      `At level ${newLevel} you gain:
${getLevelUpSummary(gains)}`,
      "Level Up",
      "Cancel",
      () => applyLevelUp(newLevel, gains),
    );
  }

  // Level 0 Characters (GM Core): reaching 1st level means choosing a class
  function levelUpFromZero() {
    api.showConfirm(
      "Level Up to 1",
      "Choose your class. You gain its key attribute boost, Hit Points, proficiencies, class features, and 1st-level feats.",
      "Choose Class",
      "Cancel",
      () => {
        api.showPrompt(
          "Choose a Class",
          "Select your class for 1st level",
          "Select Class...",
          null,
          { type: "class", query: {} },
          (selected) => {
            const classRecord = getPromptSelections(selected)[0];
            if (classRecord && typeof classRecord === "object") {
              applyClassAtFirstLevel(classRecord);
            }
          },
          "OK",
          "Cancel",
          1,
        );
      },
    );
  }

  // Mirrors onDropClass, then walks through the 1st-level choices
  function applyClassAtFirstLevel(classRecord) {
    const classObj = { ...classRecord, data: { ...classRecord.data } };
    const traits = classObj.data?.traits || [];
    const nonRarityTraits = traits.filter((trait) => !getIsTraitRarity(trait));
    classObj.data.traits = nonRarityTraits;
    const traitsObjects = nonRarityTraits.map((trait) => ({
      _id: generateUuid(),
      name: trait,
      identified: true,
      data: {},
    }));
    const newTraits = [
      ...new Set([...(record.data?.traits || []), ...nonRarityTraits]),
    ];
    const newTraitsList = [
      ...(record.data?.traitsList || []),
      ...traitsObjects,
    ].filter(
      (trait, index, self) =>
        self.findIndex((t) => t.name === trait.name) === index,
    );
    const keyOptions = classObj.data?.keyAbility || [];
    const newXp = Math.max(
      0,
      (record.data?.xp || 0) - getXpToNextLevel(record),
    );

    api.setValues(
      {
        "data.level": 1,
        "data.xp": newXp,
        "fields.levelUpBtn.hidden": newXp < 1000,
        "data.classes": [classObj],
        "data.className": classObj.name,
        "data.traitsList": newTraitsList,
        "data.traits": newTraits,
        "data.keyAbility": keyOptions.length === 1 ? keyOptions[0] : "",
        // The creation wizard hid the key attribute while at level 0
        "fields.keyAbility.hidden": false,
        "fields.classes.hidden": false,
        "fields.classDetailsLabel.hidden": true,
      },
      (recordUpdated) => {
        // Recalculate HP, proficiencies and feat slots, then the choices
        onAddEditFeature(
          recordUpdated,
          () => {
            const steps = [];
            if (keyOptions.length > 1) {
              steps.push((next) => promptFirstLevelKeyAttribute(keyOptions, next));
            }
            const skillPicks = getLevelZeroClassSkillPicks(classObj);
            if (skillPicks > 0) {
              steps.push((next) => promptFirstLevelSkills(skillPicks, next));
            }
            // The ancestry feat was chosen at level 0, so its slot is skipped
            for (const featType of getLevelUpGains(recordUpdated, 1).featTypes) {
              steps.push((next) => promptLevelUpFeat(featType, 1, next));
            }
            runLevelUpSteps(steps, 0, 1);
          },
          true,
        );
      },
    );
  }

  function promptFirstLevelKeyAttribute(keyOptions, next) {
    api.showPrompt(
      "Key Attribute",
      "Choose your class's key attribute. It gains your class's attribute boost.",
      "Choose an Attribute...",
      keyOptions.map((ability) => ({
        label: getLabelForAbility(ability),
        value: ability,
      })),
      null,
      (selected) => {
        const ability = getPromptSelections(selected)[0];
        if (!ability) {
          next();
          return;
        }
        api.setValues({ "data.keyAbility": ability }, () => next());
      },
      "OK",
      "Skip",
      1,
    );
  }

  function promptFirstLevelSkills(count, next) {
    api.getRecord("characters", record._id, (latestRecord) => {
      const options = getWizardSkillPicks(latestRecord).options;
      if (options.length === 0) {
        next();
        return;
      }
      api.showPrompt(
        "Class Skills",
        `Your class trains you in ${count} more skill${
          count === 1 ? "" : "s"
        }. The skills you chose at level 0 count toward your class's total.`,
        "Choose Skills...",
        options,
        null,
        (selected) => {
          const skills = getPromptSelections(selected).slice(0, count);
          if (skills.length === 0) {
            next();
            return;
          }
          const valuesToSet = {};
          for (const skill of skills) {
            valuesToSet[`data.${skill}`] = "1";
          }
          api.setValues(valuesToSet, () => next());
        },
        "OK",
        "Skip",
        count,
      );
    });
  }

  function applyLevelUp(newLevel, gains) {
    const newXp = Math.max(0, (record.data?.xp || 0) - getXpToNextLevel(record));
    const showLevelUpBtn = newXp >= 1000 && newLevel < 20;
    const valuesToSet = {
      "data.level": newLevel,
      // Decrease XP by 1000
      "data.xp": newXp,
      // Hide the level up button if XP needed
      "fields.levelUpBtn.hidden": !showLevelUpBtn,
    };
    Object.assign(valuesToSet, getFreeBoostFieldsForLevel(record, newLevel));

    api.setValues(valuesToSet, (recordUpdated) => {
      // Recalculate HP, proficiencies and feat slots for the new level, then
      // walk through this level's choices
      onAddEditFeature(
        recordUpdated,
        () => {
          const steps = [];
          if (gains.attributeBoosts) {
            steps.push((next) => promptLevelUpBoosts(newLevel, gains, next));
          }
          if (gains.skillIncrease) {
            steps.push((next) => promptLevelUpSkillIncrease(newLevel, next));
          }
          for (const featType of gains.featTypes) {
            steps.push((next) => promptLevelUpFeat(featType, newLevel, next));
          }
          // Automatic Bonus Progression choices
          for (const pick of gains.abp?.skillPicks || []) {
            steps.push((next) =>
              promptAbpSkillPotency(record._id, newLevel, pick, next),
            );
          }
          if (gains.abp?.apex) {
            steps.push((next) => promptAbpApex(record._id, next));
          }
          runLevelUpSteps(steps, 0, newLevel);
        },
        true,
      );
    });
  }

  function runLevelUpSteps(steps, index, newLevel) {
    if (index >= steps.length) {
      // Final pass, prompting for any class feature choices at this level
      api.getRecord("characters", record._id, (updatedRecord) => {
        onAddEditFeature(updatedRecord);
        api.showNotification(
          `${record.name || "Character"} is now level ${newLevel}.`,
          "green",
          "Level Up",
        );
      });
      return;
    }
    steps[index](() => runLevelUpSteps(steps, index + 1, newLevel));
  }

  function promptLevelUpBoosts(newLevel, gains, next) {
    const setLevel = gains.boostSetLevel || newLevel;
    const field = `freeBoostsLevel${setLevel}`;

    api.getRecord("characters", record._id, (latestRecord) => {
      const current = latestRecord.data?.[field];
      const existing = Array.isArray(current) ? current : current ? [current] : [];

      // Gradual Ability Boosts: one boost, not repeating one already in this set
      if (gains.boostCount === 1) {
        api.showPrompt(
          `Level ${newLevel} Attribute Boost`,
          `Choose 1 attribute. You can't boost the same attribute twice in this set (levels ${
            setLevel - 3
          } to ${setLevel}). Above +4, a boost is a partial boost.`,
          "Choose an Attribute...",
          getLevelUpBoostOptions(latestRecord).filter(
            (option) => !existing.includes(option.value),
          ),
          null,
          (selected) => {
            const boost = getPromptSelections(selected)[0];
            if (!boost) {
              next();
              return;
            }
            api.setValues({ [`data.${field}`]: [...existing, boost] }, () =>
              next(),
            );
          },
          "OK",
          "Skip",
          1,
        );
        return;
      }

      api.showPrompt(
        `Level ${newLevel} Attribute Boosts`,
        "Choose 4 different attributes. Above +4, a boost is a partial boost: two partial boosts raise the modifier by 1.",
        "Choose 4 Attributes...",
        getLevelUpBoostOptions(latestRecord),
        null,
        (selected) => {
          const boosts = getPromptSelections(selected).slice(0, 4);
          if (boosts.length === 0) {
            next();
            return;
          }
          api.setValues({ [`data.${field}`]: boosts }, () => next());
        },
        "OK",
        "Skip",
        4,
      );
    });
  }

  function promptLevelUpSkillIncrease(newLevel, next) {
    api.getRecord("characters", record._id, (latestRecord) => {
      const options = getSkillIncreaseOptions(latestRecord, newLevel);
      if (options.length === 0) {
        next();
        return;
      }
      api.showPrompt(
        `Level ${newLevel} Skill Increase`,
        "Raise one skill by one rank. Master requires level 7 and Legendary requires level 15. To raise a Lore skill instead, skip this and set it on the Skills tab.",
        "Choose a Skill...",
        options,
        null,
        (selected) => {
          const skill = getPromptSelections(selected)[0];
          if (!skill) {
            next();
            return;
          }
          const rank = parseInt(latestRecord.data?.[skill] || "0", 10) || 0;
          api.setValues({ [`data.${skill}`]: `${rank + 1}` }, () => next());
        },
        "OK",
        "Skip",
        1,
      );
    });
  }

  function promptLevelUpFeat(featType, newLevel, next) {
    api.getRecord("characters", record._id, (latestRecord) => {
      const feats = latestRecord.data?.feats || [];
      const slotIndex = feats.findIndex(
        (feat) =>
          feat.data?.type === "slot" &&
          feat.data?.featSlotType === featType &&
          parseInt(feat.data?.level, 10) === newLevel,
      );
      // Already filled, or the class has no slot for it
      if (slotIndex === -1) {
        next();
        return;
      }

      api.showPrompt(
        `Select a ${capitalize(featType)} Feat for Level ${newLevel}`,
        "Select Feat",
        "Select a Feat...",
        null,
        getFeatSlotQuery(latestRecord, featType, newLevel),
        (selected) => {
          const feat = getPromptSelections(selected)[0];
          if (!feat || typeof feat !== "object") {
            next();
            return;
          }
          const dedicationWarning = getDedicationWarning(latestRecord, feat);
          if (dedicationWarning) {
            api.showNotification(dedicationWarning, "yellow", "Dedication Feat");
          }
          api.setValues(
            {
              [`data.feats.${slotIndex}`]: buildFilledFeatSlot(
                feats[slotIndex],
                feat,
              ),
            },
            () => next(),
          );
        },
        "OK",
        "Skip",
        1,
      );
    });
  }

  function updateAbilityBoosts(value, field) {
    const boosts = {
      ancestryBoost1: record.data?.ancestryBoost1,
      ancestryBoost2: record.data?.ancestryBoost2,
      backgroundBoost1: record.data?.backgroundBoost1,
      backgroundBoost2: record.data?.backgroundBoost2,
      classBoost: record.data?.keyAbility,
      freeBoosts: record.data?.freeBoosts || [],
      freeBoostsLevel5: record.data?.freeBoostsLevel5 || [],
      freeBoostsLevel10: record.data?.freeBoostsLevel10 || [],
      freeBoostsLevel15: record.data?.freeBoostsLevel15 || [],
      freeBoostsLevel20: record.data?.freeBoostsLevel20 || [],
    };

    if (boosts[field]) {
      boosts[field] = value;
    }

    const valuesToSet = {
      "fields.ancestryBoostError.hidden": true,
      "fields.backgroundBoostError.hidden": true,
    };

    // Check for invalid ancestry/background boosts
    if (
      boosts.ancestryBoost1 &&
      boosts.ancestryBoost2 &&
      boosts.ancestryBoost1 === boosts.ancestryBoost2
    ) {
      valuesToSet["fields.ancestryBoostError.hidden"] = false;
    }

    if (
      boosts.backgroundBoost1 &&
      boosts.backgroundBoost2 &&
      boosts.backgroundBoost1 === boosts.backgroundBoost2
    ) {
      valuesToSet["fields.backgroundBoostError.hidden"] = false;
    }

    api.setValues(valuesToSet, () => {
      onAddEditFeature(record, undefined, true);
    });
  }

  function shortRest() {
    // Refocus: Focus Points back into the character's one focus pool, 1
    // however many entries give focus spells (spell-entries.js)
    const spent = getFocusPointsSpent(record);
    const focusPointsRecovered = Math.min(spent, getRefocusPoints(record));
    const valuesToSet =
      focusPointsRecovered > 0
        ? getFocusPoolValues(record, spent - focusPointsRecovered)
        : {};

    // 10 minutes of rest at full Hit Points ends the wounded condition
    // (dying.js)
    const woundedChanges = getRestWoundedChanges(record, record.data?.curhp || 0);
    Object.assign(valuesToSet, woundedChanges);
    const focusText =
      focusPointsRecovered > 0
        ? `Recovered ${focusPointsRecovered} Focus Point${focusPointsRecovered !== 1 ? "s" : ""}.`
        : "No Focus Points to recover.";
    const woundedText = woundedChanges["data.wounded"] === 0 ? " No longer wounded." : "";
    const text = `Refocusing (10 minutes). ${focusText}${woundedText}`;
    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet, () => {
        api.sendMessage(text, undefined, [], []);
      });
    } else {
      api.sendMessage(text, undefined, [], []);
    }
  }

  // Resets spells, alchemy for alchemists, and provides healing
  function rest() {
    const valuesToSet = {};

    // Add HP per resting rules
    // - The character regains Hit Points equal to their Constitution modifier (minimum 1) multiplied by their level.
    const level = record.data?.level || 0;
    const constitution = record.data?.con || 0;
    const constitutionModifier = Math.max(1, constitution);
    const curHp = record.data?.curhp || 0;
    const maxHp = record.data?.hitpoints || 0;

    const healedBy = Math.max(1, constitutionModifier * level);
    const newHp = Math.min(curHp + healedBy, maxHp);

    valuesToSet["data.curhp"] = newHp;

    let message = `Resting for the day.`;
    if (healedBy > 0) {
      message += ` Recovered ${healedBy} HP.`;
    }

    // Waking from a knockout, the wounded condition gone at full Hit Points,
    // and Orc Ferocity ready again (dying.js)
    const healed = getHealingChanges(record, curHp, newHp, true);
    Object.assign(valuesToSet, healed.values, getRestWoundedChanges(record, newHp));
    if (valuesToSet["data.wounded"] === 0 && getWoundedValue(record) > 0) {
      message += " No longer wounded.";
    }
    if (record.data?.orcFerocityUsed) {
      valuesToSet["data.orcFerocityUsed"] = false;
    }

    // Detemine if any spells need to be reset
    const spellcastingEntries = record.data?.spells || [];
    spellcastingEntries.forEach((spellcastingEntry, spellListIndex) => {
      const isInnate =
        spellcastingEntry.data?.type === "innate" ||
        spellcastingEntry.data?.type === "item";
      const isFocus = spellcastingEntry.data?.type === "focus";
      const isSpontaneous = spellcastingEntry.data?.type === "spontaneous";
      const isPrepared =
        spellcastingEntry.data?.type === "prepared" ||
        (!isInnate && !isFocus && !isSpontaneous);

      const spellLists = [
        "cantrips",
        "spells1",
        "spells2",
        "spells3",
        "spells4",
        "spells5",
        "spells6",
        "spells7",
        "spells8",
        "spells9",
        "spells10",
      ];

      // If it's not a focus spell entry we go through each spell list of the entry
      if (!isFocus) {
        spellLists.forEach((spellList) => {
          const spells =
            api.getValue(`data.spells.${spellListIndex}.data.${spellList}`) ||
            [];
          // Go through each spell if it's innate or praepared
          if (isInnate || isPrepared) {
            spells.forEach((spell, index) => {
              const dataPathToSpell = `data.spells.${spellListIndex}.data.${spellList}.${index}`;
              if (isInnate) {
                // If this is innate, we reset uses of the spell
                const maxUses = spell.data?.maxUses || 0;
                valuesToSet[`${dataPathToSpell}.data.uses`] = maxUses;
              } else if (isPrepared) {
                // If it's a prepared spell, we need to mark the spell as not used
                valuesToSet[`${dataPathToSpell}.data.used`] = false;
                valuesToSet[`${dataPathToSpell}.fields.nameUsedBox.hidden`] =
                  true;
                valuesToSet[`${dataPathToSpell}.fields.nameBox.hidden`] = false;
              }
            });
          } else if (isSpontaneous && spellList !== "cantrips") {
            // If this is a spontaneous spell, we need to reset the used spells
            const numSpellsField = `num${capitalize(spellList)}`;
            const usedSpellsField = `used${capitalize(spellList)}`;
            const numSpells =
              api.getValue(
                `data.spells.${spellListIndex}.data.${numSpellsField}`,
              ) || 0;
            valuesToSet[
              `data.spells.${spellListIndex}.data.${usedSpellsField}`
            ] = numSpells;
          }
        });
      } else {
        // If this is a focus spell entry we just reset the focus pool
        valuesToSet[`data.spells.${spellListIndex}.data.focusPool`] = 0;
      }
    });
    // The character's one focus pool refills (spell-entries.js)
    Object.assign(valuesToSet, getFocusPoolValues(record, 0));

    // Reset advanced alchemy items (for Alchemist class)
    const advancedAlchemyItems = record.data?.advancedAlchemyItems || [];
    advancedAlchemyItems.forEach((item, index) => {
      const itemFieldsPath = `data.advancedAlchemyItems.${index}.fields`;
      const itemDataPath = `data.advancedAlchemyItems.${index}.data`;
      valuesToSet[`${itemDataPath}.craftingDeleteBtn`] = "markCrafted";
      valuesToSet[`${itemFieldsPath}.markedNameBox.hidden`] = true;
      valuesToSet[`${itemFieldsPath}.unmarkedNameBox.hidden`] = false;
    });

    let hasAlchemistClass = false;
    const classObjs = record.data?.classes || [];
    for (const classObj of classObjs) {
      if (classObj?.name.toLowerCase().startsWith("alchemist")) {
        hasAlchemistClass = true;
      }
    }

    // Remove all infused items
    const inventory = record.data?.inventory || [];
    const itemsToRemove = [];
    inventory.forEach((item, index) => {
      // Ignore versatile vials since we handle it separately
      const traits = item?.data?.traits || [];
      const hasInfusedTrait = traits
        .map((trait) => trait.toLowerCase())
        .includes("infused");
      if (
        hasInfusedTrait &&
        !item?.name.toLowerCase().startsWith("versatile vial")
      ) {
        itemsToRemove.push(item._id);
      }
    });
    if (itemsToRemove.length > 0) {
      message += " Removed all infused items.";
    }

    let needToAddVials = false;
    let numVersatileVials = 0;
    // Versatile vials are a remaster (Player Core 2) feature; legacy
    // alchemists use infused reagents instead
    const alchemistClass = getAlchemistClass(record);
    if (hasAlchemistClass && !isLegacyClass(alchemistClass)) {
      // Make sure versatilie vials is refreshed
      // During your daily preparations, you can create a number of versatile vials up to 2 + your Intelligence modifier
      const int = record.data?.int || 0;
      numVersatileVials = 2 + int;
      const versatileVials = inventory.find((item) =>
        item?.name.toLowerCase().startsWith("versatile vial"),
      );
      if (versatileVials) {
        const versatileVialsIndex = inventory.findIndex(
          (item) => item._id === versatileVials._id,
        );
        const itemDataPath = `data.inventory.${versatileVialsIndex}.data`;
        valuesToSet[`${itemDataPath}.count`] = numVersatileVials;
      } else {
        needToAddVials = true;
      }
      message += " Refreshed Versatile Vials.";
    }

    // Find effects that need to be modified
    const effects = record?.effects || [];
    const fatiguedEffect = effects.find((effect) =>
      effect.name.toLowerCase().startsWith("fatigued"),
    );
    const doomedEffect = effects.find((effect) =>
      effect.name.toLowerCase().startsWith("doomed"),
    );
    const drainedEffect = effects.find((effect) =>
      effect.name.toLowerCase().startsWith("drained"),
    );

    // Process effects after all item operations complete
    const processEffects = () => {
      // The character loses the fatigued condition
      if (fatiguedEffect) {
        message += " Lost the fatigued condition.";
        api.deductEffectById(fatiguedEffect._id, record, () => {
          // The character reduces the severity of the doomed condition by 1
          if (doomedEffect) {
            message += " Doomed condition reduced by 1.";
            api.deductEffectById(doomedEffect._id, record, () => {
              // The character reduces the severity of the drained condition by 1
              if (drainedEffect) {
                message += " Drained condition reduced by 1.";
                api.deductEffectById(drainedEffect._id, record, () => {
                  api.sendMessage(message, undefined, [], []);
                });
              } else {
                api.sendMessage(message, undefined, [], []);
              }
            });
          } else if (drainedEffect) {
            message += " Drained condition reduced by 1.";
            api.deductEffectById(drainedEffect._id, record, () => {
              api.sendMessage(message, undefined, [], []);
            });
          } else {
            api.sendMessage(message, undefined, [], []);
          }
        });
      } else {
        // No fatigued effect, check for doomed
        if (doomedEffect) {
          message += " Doomed condition reduced by 1.";
          api.deductEffectById(doomedEffect._id, record, () => {
            if (drainedEffect) {
              message += " Drained condition reduced by 1.";
              api.deductEffectById(drainedEffect._id, record, () => {
                api.sendMessage(message, undefined, [], []);
              });
            } else {
              api.sendMessage(message, undefined, [], []);
            }
          });
        } else if (drainedEffect) {
          message += " Drained condition reduced by 1.";
          api.deductEffectById(drainedEffect._id, record, () => {
            api.sendMessage(message, undefined, [], []);
          });
        } else {
          api.sendMessage(message, undefined, [], []);
        }
      }
    };

    const queryAndAddVials = () => {
      // Look for an item call "Versatile Vial"
      api.getRecordByTypeAndName("items", "Versatile Vial", (item) => {
        if (item) {
          api.addValue(
            "data.inventory",
            {
              ...item,
              data: {
                ...item.data,
                carried: "carried",
                ammo: numVersatileVials,
                count: numVersatileVials,
              },
              fields: {
                ...(item.fields || {}),
                ...getItemFields(item),
              },
            },
            () => {
              if (itemsToRemove.length > 0) {
                removeValuesSequentially(itemsToRemove, processEffects);
              } else {
                processEffects();
              }
            },
          );
        } else if (itemsToRemove.length > 0) {
          removeValuesSequentially(itemsToRemove, processEffects);
        } else {
          processEffects();
        }
      });
    };

    // Chain effect changes synchronously through callbacks
    api.setValues(valuesToSet, () => {
      if (healed.wake) {
        wakeCreature(record);
      }
      if (needToAddVials) {
        queryAndAddVials();
      } else {
        if (itemsToRemove.length > 0) {
          removeValuesSequentially(itemsToRemove, processEffects);
        } else {
          processEffects();
        }
      }
    });
  }

  function removeValuesSequentially(itemIds, callback) {
    // Remove items by ID using removeValueFromRecord to maintain updated record state
    // Start by getting the initial record
    api.getRecord(record.recordType, record._id, (currentRecord) => {
      function removeNext(idIndex, workingRecord) {
        if (idIndex >= itemIds.length) {
          // All items removed, call the callback
          if (callback) {
            callback();
          }
          return;
        }

        const itemIdToRemove = itemIds[idIndex];
        const currentInventory = workingRecord.data?.inventory || [];
        const itemIndex = currentInventory.findIndex(
          (item) => item._id === itemIdToRemove,
        );

        if (itemIndex === -1) {
          // Item not found, move to next
          removeNext(idIndex + 1, workingRecord);
          return;
        }

        api.removeValueFromRecord(
          workingRecord,
          `data.inventory`,
          itemIndex,
          (updatedRecord) => {
            // Move to the next item with the updated record
            removeNext(idIndex + 1, updatedRecord);
          },
        );
      }

      // Start removing from the first item
      if (itemIds.length === 0) {
        if (callback) {
          callback();
        }
        return;
      }

      removeNext(0, currentRecord);
    });
  }

  function onAlternateAncestryBoostsChange(value) {
    setAncestryBoostFields(value, true);
  }

  function setAncestryBoostFields(
    overrideAlternateAncestryBoosts,
    updateStats = false,
  ) {
    // If alternateAncestryBoosts is true, or if we're human, we show ancestryBoost2
    let alternateAncestryBoosts =
      overrideAlternateAncestryBoosts || record.data?.alternateAncestryBoosts;

    const ancestry = record.data?.ancestries || [];
    const ancestryName = ancestry[0]?.data?.name || record.data?.ancestryName;
    let showAlternateAncestryBoostOptions = true;
    if (ancestryName && ancestryName.toLowerCase().startsWith("human")) {
      showAlternateAncestryBoostOptions = false;
    }
    // We can also check if they have two free ability boosts already
    if (Object.keys(ancestry[0]?.data?.boosts || {}).length >= 2) {
      const boosts = Object.values(ancestry[0]?.data?.boosts || {});
      const freeBoosts = boosts.filter((boost) => boost.length === 6);
      if (freeBoosts.length >= 2) {
        showAlternateAncestryBoostOptions = false;
      }
    }

    const valuesToSet = {};

    if (!showAlternateAncestryBoostOptions) {
      alternateAncestryBoosts = false;
    }

    // Clear the second ancestry boost only when it isn't used. Humans and
    // ancestries with two free boosts always use it, and so does a character
    // using alternate boosts. Called with no argument (when the boost
    // dropdowns load), the saved checkbox decides.
    const secondBoostUsed =
      !showAlternateAncestryBoostOptions ||
      (overrideAlternateAncestryBoosts === undefined
        ? record.data?.alternateAncestryBoosts === true
        : overrideAlternateAncestryBoosts === true ||
          overrideAlternateAncestryBoosts === "true");
    if (!secondBoostUsed && record.data?.ancestryBoost2) {
      valuesToSet["data.ancestryBoost2"] = "";
    }

    if (
      showAlternateAncestryBoostOptions &&
      record.fields?.alternateAncestryBoosts?.hidden !== false
    ) {
      valuesToSet["fields.alternateAncestryBoosts.hidden"] = false;
    } else if (
      !showAlternateAncestryBoostOptions &&
      record.fields?.alternateAncestryBoosts?.hidden !== true
    ) {
      valuesToSet["fields.alternateAncestryBoosts.hidden"] = true;
    }

    // Check if we need to show ancestryBoost2
    if (
      (alternateAncestryBoosts || !showAlternateAncestryBoostOptions) &&
      record.fields?.ancestryBoost2?.hidden !== false
    ) {
      valuesToSet["fields.ancestryBoost2.hidden"] = false;
    } else if (
      !alternateAncestryBoosts &&
      showAlternateAncestryBoostOptions &&
      record.fields?.ancestryBoost2?.hidden !== true
    ) {
      valuesToSet["fields.ancestryBoost2.hidden"] = true;
    }

    // Get the provided boosts flaws from ancestry which we show unless using alternate boosts
    let ancestryBoosts = "";
    let ancestryFlaws = "";
    if (!alternateAncestryBoosts && showAlternateAncestryBoostOptions) {
      // Get the boosts/flaws from ancestry
      let allBoosts = [];
      let allFlaws = [];
      const boosts = ancestry[0]?.data?.boosts || {};
      const flaws = ancestry[0]?.data?.flaws || {};
      // Assume that arrays of 1 are boosts that are provided to us
      for (const boost of Object.values(boosts)) {
        if (boost.length === 1) {
          allBoosts.push(getLabelForAbility(boost[0]));
        }
      }
      for (const flaw of Object.values(flaws)) {
        if (flaw.length === 1) {
          allFlaws.push(getLabelForAbility(flaw[0]));
        }
      }

      ancestryBoosts = `Boosts: ${allBoosts.join(", ")}`;
      ancestryFlaws = `Flaws: ${allFlaws.join(", ")}`;

      if (record.fields?.ancestryBoostLabel?.hidden !== false) {
        valuesToSet["fields.ancestryBoostLabel.hidden"] = false;
      }
      if (record.fields?.ancestryFlawLabel?.hidden !== false) {
        valuesToSet["fields.ancestryFlawLabel.hidden"] = false;
      }

      if (record.data?.ancestryBoostLabel !== ancestryBoosts) {
        valuesToSet["data.ancestryBoostLabel"] = ancestryBoosts;
      }
      if (record.data?.ancestryFlawLabel !== ancestryFlaws) {
        valuesToSet["data.ancestryFlawLabel"] = ancestryFlaws;
      }
    } else {
      if (record.fields?.ancestryBoostLabel?.hidden !== true) {
        valuesToSet["fields.ancestryBoostLabel.hidden"] = true;
      }
      if (record.fields?.ancestryFlawLabel?.hidden !== true) {
        valuesToSet["fields.ancestryFlawLabel.hidden"] = true;
      }
    }

    if (Object.keys(valuesToSet).length > 0) {
      const callback = updateStats
        ? () => {
            onAddEditFeature(record, undefined, true);
          }
        : undefined;

      api.setValues(valuesToSet, callback);
    }
  }

  function getAncestryBoostOptions(field) {
    // For ancestries we will assume they always have at least 1 free ability boost
    // and that the second if, using alternate boosts, is free as well
    return [
      { label: "Strength", value: "str" },
      { label: "Dexterity", value: "dex" },
      { label: "Constitution", value: "con" },
      { label: "Intelligence", value: "int" },
      { label: "Wisdom", value: "wis" },
      { label: "Charisma", value: "cha" },
    ];
  }

  function getClassBoostOptions() {
    const results = [];

    // Look at class
    const classes = record.data?.classes || [];
    for (const classObj of classes) {
      const keyAbility = classObj.data?.keyAbility || [];
      for (const ability of keyAbility) {
        results.push({
          label: getLabelForAbility(ability),
          value: ability,
        });
      }
      // Look for class features
      const features = classObj.data?.features || [];
      for (const feature of features) {
        const keyAbility = feature.data?.keyOptions || [];
        for (const ability of keyAbility) {
          results.push({
            label: getLabelForAbility(ability),
            value: ability,
          });
        }
      }
    }

    if (results.length === 0) {
      // Just return the default boosts
      return [
        { label: "Strength", value: "str" },
        { label: "Dexterity", value: "dex" },
        { label: "Constitution", value: "con" },
        { label: "Intelligence", value: "int" },
        { label: "Wisdom", value: "wis" },
        { label: "Charisma", value: "cha" },
      ];
    }

    // Filter duplicates
    const filteredResults = results.filter(
      (result, index, self) =>
        index === self.findIndex((t) => t.value === result.value),
    );

    return filteredResults;
  }

  function getBackgroundBoostOptions(field) {
    // Get the boosts already provided by the background and return the default less those
    // Or if none, return the default
    let boosts = [
      { label: "Strength", value: "str" },
      { label: "Dexterity", value: "dex" },
      { label: "Constitution", value: "con" },
      { label: "Intelligence", value: "int" },
      { label: "Wisdom", value: "wis" },
      { label: "Charisma", value: "cha" },
    ];

    const background = record.data?.backgrounds?.[0]?.data;
    const backgroundBoosts = background?.boosts || {};

    if (field === "backgroundBoost1") {
      // Took at boosts.0 from background
      if (backgroundBoosts?.["0"] && backgroundBoosts["0"].length > 0) {
        boosts = backgroundBoosts?.["0"].map((boost) => ({
          label: getLabelForAbility(boost),
          value: boost,
        }));
      }
    } else if (field === "backgroundBoost2") {
      // Took at boosts.1 from background
      if (backgroundBoosts?.["1"] && backgroundBoosts["1"].length > 0) {
        boosts = backgroundBoosts?.["1"].map((boost) => ({
          label: getLabelForAbility(boost),
          value: boost,
        }));
      }
    }

    // Filter duplicates
    boosts = boosts.filter(
      (boost, index, self) =>
        index === self.findIndex((t) => t.value === boost.value),
    );

    return boosts;
  }

  function onChangeShieldHp(value) {
    // If shield HP is <= BT, set broken true
    const shieldHp = value || 0;
    const brokenThreshold = record.data?.shieldBt || 0;
    const broken = shieldHp <= brokenThreshold;

    // Get the shield index and update the HP on the item as well
    const valuesToSet = {};
    const bestArmor = getBestEquippedArmor(record);
    if (bestArmor?.shield?.shieldIndex != null) {
      valuesToSet[
        `data.inventory.${bestArmor.shield.shieldIndex}.data.hp.value`
      ] = shieldHp;
    }

    if (broken !== record.data?.shieldBroken) {
      valuesToSet["data.shieldBroken"] = broken;
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onChangeShieldMaxHp(value) {
    const shieldMaxHp = value || 0;
    const shieldHp = record.data?.shieldHp || 0;
    const valuesToSet = {};
    const bestArmor = getBestEquippedArmor(record);

    const brokenThreshold = Math.floor(shieldMaxHp / 2);
    if (brokenThreshold !== record.data?.shieldBt) {
      valuesToSet["data.shieldBt"] = brokenThreshold;
    }

    const broken = shieldHp <= brokenThreshold;
    if (broken !== record.data?.shieldBroken) {
      valuesToSet["data.shieldBroken"] = broken;
    }

    if (bestArmor?.shield?.shieldIndex != null) {
      valuesToSet[
        `data.inventory.${bestArmor.shield.shieldIndex}.data.hp.max`
      ] = shieldMaxHp;
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onChangeShieldValue(value, field) {
    const valuesToSet = {};
    const bestArmor = getBestEquippedArmor(record);
    if (bestArmor?.shield?.shieldIndex != null) {
      valuesToSet[
        `data.inventory.${bestArmor.shield.shieldIndex}.data.${field}`
      ] = value;
    }

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }
</script>

          minvalue="0"
        ></counter>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
          "
        >
          <label
            class="rvtt-sheet-label rvtt-sheet-label--accent"
            label="Recovery"
          ></label>
          <iconbutton
            size="md"
            variant="subtle"
            color="red"
            options='[{"icon": "D20", "label": "Roll Recovery Check", "value": "roll"}]'
            field="Roll Recovery Check"
            onclick="rollRecoveryCheck()"
          ></iconbutton>
          <span class="rvtt-sheet-mono-dim" style="margin-left: 6px"
            >&#9670;</span
          >
          <iconbutton
            size="md"
            variant="subtle"
            options='[{"icon": "IconCampfire", "label": "Refocus", "value": "refocus"}]'
            field="Refocus"
            onclick="shortRest()"
          ></iconbutton>
          <iconbutton
            size="md"
            variant="subtle"
            options='[{"icon": "IconBed", "label": "Rest", "value": "rest"}]'
            field="Rest"
            onclick="rest()"
          ></iconbutton>
        </div>
      </div>

      <!-- Perception strip -->
      <div
        style="
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 6px 10px;
          border: 1px solid var(--border, var(--mantine-color-default-border));
          background: var(--surface, transparent);
          margin-bottom: 8px;
        "
      >
        <label
          class="rvtt-sheet-label rvtt-sheet-label--accent"
          field="perceptionLabel"
          label="Perception"
        ></label>
        <numberfield
          placeholder="0"
          size="xs"
          width="56px"
          field="perceptionMod"
          showsign="true"
          textalign="center"
          hidecontrols="true"
        ></numberfield>
        <iconbutton
          size="md"
          variant="subtle"
          options='[{"icon": "D20", "label": "Roll Perception", "value": "roll"}]'
          field="Roll Perception"
          onclick="rollPerception()"
        ></iconbutton>
        <dropdown
          size="xs"
          field="perception"
          width="120px"
          textalign="center"
          placeholder="Trained"
          defaultvalue="1"
          onchange="updatePerceptionProficiency(value)"
          options='[{"label": "None", "value": "0"}, {"label": "Trained", "value": "1"}, {"label": "Expert", "value": "2"}, {"label": "Master", "value": "3"}, {"label": "Legendary", "value": "4"}]'
        ></dropdown>
        <div style="margin-left: auto">
          <dropdown
            size="xs"
            field="rollAsPerception"
            width="110px"
            placeholder="Roll as..."
            options='[{"label": "No Action", "value": "none"}, {"label": "Seek", "value": "Seek"}, {"label": "Sense Motive", "value": "Sense Motive"}]'
            onchange="rollPerceptionAs(value)"
          ></dropdown>
        </div>
      </div>

      <div class="rvtt-sheet-divider">
        <span class="rvtt-sheet-divider__label"
          >&#10022; Identity &#10022;</span
        >
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            align-items: flex-end;
          "
        >
          <div style="display: flex; gap: 4px; align-items: flex-end">
            <stringfield
              width="100%"
              size="xs"
              field="ancestryName"
              placeholder="Drag an Ancestry&#8230;"
              label="Ancestry"
            ></stringfield>
            <list
              width="fit-content"
              height="32px"
              hidden="true"
              listtype="record_link_list"
              field="ancestries"
              onchange="onDeleteAncestry()"
            ></list>
          </div>
          <div style="display: flex; gap: 4px; align-items: flex-end">
            <stringfield
              width="100%"
              size="xs"
              field="heritageName"
              placeholder="Drag a Heritage&#8230;"
              label="Heritage"
            ></stringfield>
            <list
              width="fit-content"
              height="32px"
              hidden="true"
              listtype="record_link_list"
              field="heritages"
              onchange="onDeleteHeritage()"
            ></list>
          </div>
        </div>

        <div style="display: flex; gap: 4px; align-items: flex-end">
          <stringfield
            width="100%"
            size="xs"
            field="backgroundName"
            placeholder="Drag a Background&#8230;"
            label="Background"
          ></stringfield>
          <list
            width="fit-content"
            height="32px"
            hidden="true"
            listtype="record_link_list"
            field="backgrounds"
            onchange="onDeleteBackground()"
          ></list>
        </div>

        <div
          style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px"
        >
          <dropdown
            size="xs"
            field="size"
            label="Size"
            placeholder="Medium"
            defaultvalue="medium"
            options='[{"label": "Tiny", "value": "tiny"}, {"label": "Small", "value": "small"}, {"label": "Medium", "value": "medium"}, {"label": "Large", "value": "large"}, {"label": "Huge", "value": "huge"}, {"label": "Gargantuan", "value": "gargantuan"}]'
          ></dropdown>
          <stringfield
            size="xs"
            field="speed"
            label="Speed"
            placeholder="Speed"
          ></stringfield>
          <stringfield
            size="xs"
            field="senses"
            label="Senses"
            placeholder="None"
          ></stringfield>
        </div>

        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            align-items: flex-start;
            margin-top: 4px;
          "
        >
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="display: flex; align-items: center; gap: 4px">
              <label
                class="rvtt-sheet-label rvtt-sheet-label--accent"
                label="Languages"
              ></label>
              <popover position="bottom" offset="4" witharrow="true">
                <popover.target>
                  <iconbutton
                    size="sm"
                    variant="subtle"
                    hideonlocked="true"
                    options='[{"icon": "IconEdit", "label": "Edit Languages", "value": "languages"}]'
                    field="Edit Languages"
                  ></iconbutton>
                </popover.target>
                <popover.dropdown>
                  <div
                    style="
                      display: flex;
                      flex-direction: column;
                      gap: 4px;
                      width: 300px;
                    "
                  >
                    <dropdown
                      size="xs"
                      field="languages"
                      placeholder="Enter Languages..."
                      multiselect="100"
                      width="100%"
                      combo="true"
                      label="Languages"
                      onchange="updateLanguages(value)"
                      optionsfunction="return getLanguageOptions();"
                    ></dropdown>
                  </div>
                </popover.dropdown>
              </popover>
            </div>
            <list
              field="languagesList"
              listtype="language_list"
              size="xs"
            ></list>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="display: flex; align-items: center; gap: 4px">
              <label
                class="rvtt-sheet-label rvtt-sheet-label--accent"
                label="Traits"
              ></label>
              <popover position="bottom" offset="4" witharrow="true">
                <popover.target>
                  <iconbutton
                    size="sm"
                    variant="subtle"
                    hideonlocked="true"
                    options='[{"icon": "IconEdit", "label": "Edit Traits", "value": "traits"}]'
                    field="Edit Traits"
                  ></iconbutton>
                </popover.target>
                <popover.dropdown>
                  <div
                    style="
                      display: flex;
                      flex-direction: column;
                      gap: 4px;
                      width: 300px;
                    "
                  >
                    <dropdown
                      size="xs"
                      field="traits"
                      placeholder="Enter Traits..."
                      multiselect="100"
                      width="100%"
                      combo="true"
                      label="Traits"
                      onchange="setTraits(value)"
                      optionsfunction="return getTraitOptions();"
                    ></dropdown>
                  </div>
                </popover.dropdown>
              </popover>
            </div>
            <list
              field="traitsList"
              listtype="traits_list"
              size="xs"
              emptylisttext="None"
            ></list>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
