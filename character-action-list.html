<script>
  function onUseAction() {
    // Get the action by path to ensure most up-to-date value
    const actionDataPath = dataPath.replace(".data.useBtn", "");
    const action = api.getValue(actionDataPath);
    useAction(action, actionDataPath);
  }
</script>

<accordion
  size="xs"
  field="descriptionOpen"
  label="Description"
  chevronposition="left"
>
  <accordion.control>
    <div style="display: column; gap: 2px; width: 100%">
      <div style="display: flex; gap: 2px; width: 100%">
        <div
          style="width: 30px; height: 30px; min-width: 30px; min-height: 30px"
        >
          <portrait width="30px" height="30px" field="portrait"></portrait>
        </div>
        <namefield
          size="xs"
          width="100%"
          variant="unstyled"
          field="namefield"
          placeholder="Ability Name..."
        ></namefield>
        <div
          style="margin-left: auto; display: flex; align-items: center; gap: 4px"
        >
          <!-- Uses left, for an action with a frequency (limited-uses.js) -->
          <counter
            field="usesLeft"
            maxvaluefield="usesMax"
            size="xs"
            textalign="center"
            color="cyan"
            editable="true"
            hidden="true"
          ></counter>
          <label field="usesLabel" size="xs" hidden="true"></label>
          <button
            size="xxs"
            radius="xs"
            field="useBtn"
            label="Use"
            onclick="onUseAction();"
          ></button>
        </div>
      </div>
    </div>
  </accordion.control>
  <richtextfield
    disablecontrols="true"
    field="description"
    placeholder="Enter description..."
  ></richtextfield>
</accordion>
