<script>
  function onDrop(value, recordLink) {
    const dataPathToFeat = getNearestParentDataPath(dataPath);
    const featSlot = api.getValue(dataPathToFeat);
    const feat = recordLink?.value;

    if (value === "feats") {
      // Requery the record to get the latest record
      api.getRecord(record.recordType, record._id, (updatedRecord) => {
        onDropFeat(updatedRecord, value, recordLink);
      });
    }
  }

  function onDropFeat(updatedRecord, value, recordLink) {
    const dataPathToFeat = getNearestParentDataPath(dataPath);
    const featSlot = api.getValueOnRecord(updatedRecord, dataPathToFeat);
    const feat = recordLink?.value;

    // If this is a feat slot, we set it
    const valuesToSet = {};

    // Make sure it matches the LEVEL of the slots and the featSlotType else
    // notify error
    const featLevel = parseInt(feat?.data?.level || "0", 10);
    const slotLevel = parseInt(featSlot?.data?.level || "0", 10);
    const featSlotType = featSlot?.data?.featSlotType;
    const featType = feat?.data?.type;

    // Check if feat level is too high for the slot
    if (featLevel > slotLevel) {
      api.showNotification(
        `This slot requires a level of ${slotLevel} or lower.`,
        "red",
        "Feat Level Mismatch"
      );
      return;
    }

    // Check if feat type matches slot type
    if (featSlotType === "ancestry" && featType !== "ancestry") {
      api.showNotification(
        `This slot only accepts Ancestry feats.`,
        "red",
        "Feat Type Mismatch"
      );
      return;
    }

    if (featSlotType === "class" && featType !== "class") {
      api.showNotification(
        `This slot only accepts Class feats.`,
        "red",
        "Feat Type Mismatch"
      );
      return;
    }

    const isArchetypeFeat = (feat?.data?.traits || []).some(
      (trait) => `${trait}`.toLowerCase() === "archetype"
    );
    if (featSlotType === "archetype" && !isArchetypeFeat) {
      api.showNotification(
        `This slot only accepts Archetype feats.`,
        "red",
        "Feat Type Mismatch"
      );
      return;
    }

    // Remind about the dedication rule, but let the GM decide
    const dedicationWarning = getDedicationWarning(updatedRecord, feat);
    if (dedicationWarning) {
      api.showNotification(dedicationWarning, "yellow", "Dedication Feat");
    }

    if (
      featSlotType === "general" &&
      featType !== "general" &&
      featType !== "skill"
    ) {
      api.showNotification(
        `This slot only accepts General or Skill feats.`,
        "red",
        "Feat Type Mismatch"
      );
      return;
    }

    if (featSlotType === "skill" && featType !== "skill") {
      api.showNotification(
        `This slot only accepts Skill feats.`,
        "red",
        "Feat Type Mismatch"
      );
      return;
    }

    if (featSlot.data?.type === "slot") {
      valuesToSet[`${dataPathToFeat}`] = {
        ...feat,
        _id: featSlot?._id,
        data: {
          ...feat?.data,
          level: featSlot?.data?.level,
          featSlotType: featSlot?.data?.featSlotType,
          slotOrder: featSlot?.data?.slotOrder,
        },
        fields: {
          ...(feat?.fields || {}),
          featDetails: { hidden: false },
          featSlot: { hidden: true },
        },
      };

      api.setValuesOnRecord(updatedRecord, valuesToSet, (updatedRecord2) => {
        onAddEditFeature(updatedRecord2);
      });
    }
  }

  function clearFeat() {
    const dataPathToFeat = getNearestParentDataPath(dataPath);
    const featSlot = api.getValue(dataPathToFeat);

    onDeleteFeat = () => {
      if (featSlot.data?.type !== "slot") {
        const valuesToSet = {};
        valuesToSet[`${dataPathToFeat}`] = {
          name: capitalize(featSlot?.data?.featSlotType) + " Feat Slot",
          unidentifiedName:
            capitalize(featSlot?.data?.featSlotType) + " Feat Slot",
          _id: featSlot?._id,
          data: {
            type: "slot",
            description: "",
            level: featSlot?.data?.level,
            featSlotType: featSlot?.data?.featSlotType,
            slotOrder: featSlot?.data?.slotOrder,
            actionType: "",
            prerequisites: "",
            actions: [],
            levelLabel: "",
            traitsList: [],
            traits: [],
            modifiers: [],
            item: [],
            choices: [],
            proficiencies: [],
            providesItems: [],
          },
          fields: {
            featDetails: { hidden: true },
            featSlot: { hidden: false },
          },
        };
        api.setValues(valuesToSet, (updatedRecord) => {
          onAddEditFeature(updatedRecord);
        });
      }
    };

    api.showConfirm(
      "Remove Feat",
      `Are you sure you want to remove ${featSlot.name}?`,
      "Yes",
      "No",
      onDeleteFeat
    );
  }

  function showFeatSlotOptions() {
    const dataPathToFeat = getNearestParentDataPath(dataPath);
    const featSlot = api.getValue(dataPathToFeat);

    const featSlotType = featSlot?.data?.featSlotType;
    const featSlotLevel = parseInt(featSlot?.data?.level || "0", 10);

    const optionSelection = (values) => {
      if (values.length > 0) {
        const feat = values[0];
        onDrop("feats", { value: feat, tooltip: feat.name });
      }
    };

    // Shared with the level up flow; archetype feats are allowed in class
    // slots, and archetype slots (Free Archetype) take only archetype feats
    const optionsQuery = getFeatSlotQuery(record, featSlotType, featSlotLevel);

    api.showPrompt(
      `Select a ${capitalize(featSlotType)} Feat for Level ${featSlotLevel}`,
      "Select Feat",
      `Select a Feat...`,
      null,
      optionsQuery,
      optionSelection
    );
  }
</script>
