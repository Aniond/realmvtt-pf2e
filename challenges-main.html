<script>
  // A challenge (roadmap B1, B2, challenges.js): Victory Points, a chase, an
  // infiltration, research or an Influence encounter. The GM posts checks
  // from it, and scores results from their cards.
  function getChallengeFieldValues(data) {
    const type = getChallengeType(data);
    const hidden = {
      scoringBox: type !== "victory",
      pointsBox: type === "chase",
      infiltrationBox: type !== "infiltration",
      influenceBox: type !== "influence",
    };
    const values = {};
    Object.entries(hidden).forEach(([field, value]) => {
      if (!!record.fields?.[field]?.hidden !== value) values[`fields.${field}.hidden`] = value;
    });
    const summary = getChallengeSummary(data);
    if (data?.summary !== summary) values["data.summary"] = summary;
    return values;
  }

  // On load and on a change: the type's fields, and the summary line
  function showHideFields() {
    const values = getChallengeFieldValues(record.data || {});
    if (Object.keys(values).length > 0) api.setValues(values);
  }

  function onTypeChange(value) {
    const values = getChallengeFieldValues({ ...(record.data || {}), challengeType: value });
    if (Object.keys(values).length > 0) api.setValues(values);
  }

  function onCounterChange(field, value) {
    const values = getChallengeFieldValues({ ...(record.data || {}), [field]: value });
    if (Object.keys(values).length > 0) api.setValues(values);
  }
</script>
