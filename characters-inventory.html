<script>
  function updateCoinage() {
    updateTotalBulk(record);
  }

  // After an add: a scroll or wand gets its row in the Scrolls and Wands
  // entry, then bulk is worked out (one write after the other, on the record
  // read again: item-spells.js)
  function afterItemsAdded(updated, items) {
    if (!items.some((item) => getItemSpellKind(item))) {
      updateTotalBulk(updated);
      return;
    }
    syncItemSpells(updated, (fresh) => updateTotalBulk(fresh));
  }

  function onDropItem(recordLink) {
    const item = recordLink?.value;

    // Add the item and set the attunement hidden field to visible if requires attunement
    const itemToAdd = {
      ...item,
      icon: "IconMoneybag",
      data: {
        ...item?.data,
        // Track old ID for count tracking
        fromId: item._id,
        // Default count to 1 unless otherwise specified
        count: item.data?.count || 1,
        // Default to carried
        carried: "carried",
      },
      fields: {
        ...item?.fields,
        ...getItemFields(item),
      },
    };

    // We won't stack backpacks
    const isBackpack = item.data?.type === "backpack";

    // Determine if we are adding the item or adding count to an existing item
    const items = record?.data?.inventory || [];
    const index = items.findIndex((i) => i.data?.fromId === item._id);

    // If the item is an item pack, we're adding a list of items
    if (item.data?.type === "kit") {
      // Get the total weight of all items in the pack
      const itemsInPack = item.data?.items || [];
      const valuesToSet = {};
      // Add any currency in pack to character
      valuesToSet["data.cp"] = (record?.data?.cp || 0) + (item.data?.cp || 0);
      valuesToSet["data.sp"] = (record?.data?.sp || 0) + (item.data?.sp || 0);
      valuesToSet["data.gp"] = (record?.data?.gp || 0) + (item.data?.gp || 0);
      valuesToSet["data.pp"] = (record?.data?.pp || 0) + (item.data?.pp || 0);
      const itemsToAdd = itemsInPack
        .map((item) => {
          // If this is existing item, get the current count
          const thisIndex = items.findIndex((i) => i.data?.fromId === item._id);
          const existingItem = thisIndex !== -1 ? items[thisIndex] : undefined;
          const itemCount = parseFloat(item?.data?.count || "0");
          let curCount = parseFloat(existingItem?.data?.count || "0");
          if (!existingItem) {
            return {
              ...item,
              icon: "IconMoneybag",
              data: {
                ...item.data,
                fromId: item._id,
                count: itemCount,
                carried: "carried",
              },
              fields: {
                ...item?.fields,
                ...getItemFields(item),
              },
            };
          } else {
            valuesToSet[`data.inventory.${thisIndex}.data.count`] =
              curCount + itemCount;
          }
        })
        .filter((i) => i);
      api.addValues(`data.inventory`, itemsToAdd, (record) => {
        if (Object.keys(valuesToSet).length > 0) {
          api.setValues(valuesToSet, (updatedRecord) => {
            // Update total weight after setting count values
            afterItemsAdded(updatedRecord, itemsInPack);
          });
        } else {
          // Else just update the total weight
          afterItemsAdded(record, itemsInPack);
        }
      });
    } else {
      const existingItem = index !== -1 ? items[index] : undefined;
      const countToAdd = parseFloat(item.data?.count || "1");
      if (existingItem && !isBackpack) {
        // Add count to existing item
        const count = parseFloat(existingItem.data?.count || "0");
        // Update the value
        api.setValue(
          `data.inventory.${index}.data.count`,
          count + countToAdd,
          (record) => {
            // Update total weight
            afterItemsAdded(record, [item]);
          },
        );
      } else {
        // Add the item to the list
        api.addValue(`data.inventory`, itemToAdd, (record) => {
          // Update total weight
          afterItemsAdded(record, [item]);
        });
      }
    }
  }

  function onDrop(type, recordLink, sourceInfo) {
    if (type === "items") {
      onDropItem(recordLink);
      if (sourceInfo) {
        if (sourceInfo?.type === "list") {
          // Query for the record first, then remove the item from the source list
          api.getRecord(
            sourceInfo.recordType,
            sourceInfo.recordId,
            (sourceRecord) => {
              api.removeValueFromRecord(
                sourceRecord,
                sourceInfo.dataPath,
                sourceInfo.index,
              );
            },
          );
        } else if (sourceInfo?.type === "partysheet") {
          // Remove the item from party sheet
          api.removePartySheetItem(sourceInfo.itemId);
        }
      }
    }
  }

  function onItemDeleted() {
    // Fetch the character record again to get latest data
    const valuesToSet = {};
    const totalBulk = updateTotalBulk(record, false);
    valuesToSet["data.totalBulk"] = totalBulk;

    api.setValues(valuesToSet, (recordUpdated) => {
      // A deleted scroll or wand takes its row out of the Scrolls and Wands
      // entry (item-spells.js), then attributes are updated as needed
      if (hasItemSpells(recordUpdated || record)) {
        syncItemSpells(recordUpdated || record, (fresh) =>
          onAddEditFeature(fresh, undefined, true),
        );
      } else {
        onAddEditFeature(recordUpdated, undefined, true);
      }
    });
  }

  function redistributeCurrency() {
    // Get current currency values
    let cp = record?.data?.cp || 0;
    let sp = record?.data?.sp || 0;
    let gp = record?.data?.gp || 0;
    let pp = record?.data?.pp || 0;

    // Convert CP to SP (10 cp = 1 sp)
    const cpToSp = Math.floor(cp / 10);
    sp += cpToSp;
    cp = cp % 10;

    // Convert SP to GP (10 sp = 1 gp)
    const spToGp = Math.floor(sp / 10);
    gp += spToGp;
    sp = sp % 10;

    // Convert GP to PP (10 gp = 1 pp)
    const gpToPp = Math.floor(gp / 10);
    pp += gpToPp;
    gp = gp % 10;

    api.setValues(
      {
        "data.cp": cp,
        "data.sp": sp,
        "data.gp": gp,
        "data.pp": pp,
      },
      updateCoinage,
    );
  }

  function addCurrency() {
    // Delay to ensure field values are updated before processing
    api.delay(() => {
      // Requery the record to get the latest data
      api.getRecord(record.recordType, record._id, (record2) => {
        const addCp = parseInt(record2?.data?.addCp || "0") || 0;
        const addSp = parseInt(record2?.data?.addSp || "0") || 0;
        const addGp = parseInt(record2?.data?.addGp || "0") || 0;
        const addPp = parseInt(record2?.data?.addPp || "0") || 0;

        const newCp = (record2?.data?.cp || 0) + addCp;
        const newSp = (record2?.data?.sp || 0) + addSp;
        const newGp = (record2?.data?.gp || 0) + addGp;
        const newPp = (record2?.data?.pp || 0) + addPp;

        api.setValues(
          {
            "data.cp": newCp,
            "data.sp": newSp,
            "data.gp": newGp,
            "data.pp": newPp,
            "data.addCp": "",
            "data.addSp": "",
            "data.addGp": "",
            "data.addPp": "",
          },
          updateCoinage,
        );
        api.closeOpenedPopovers();
      });
    }, 300);
  }

  function deductCurrency() {
    // Delay to ensure field values are updated before processing
    api.delay(() => {
      api.getRecord(record.recordType, record._id, (record2) => {
        const deductCp = parseInt(record2?.data?.deductCp || "0") || 0;
        const deductSp = parseInt(record2?.data?.deductSp || "0") || 0;
        const deductGp = parseInt(record2?.data?.deductGp || "0") || 0;
        const deductPp = parseInt(record2?.data?.deductPp || "0") || 0;
        const redistributeGold = record2?.data?.redistributeGold || false;

        let currentCp = record2?.data?.cp || 0;
        let currentSp = record2?.data?.sp || 0;
        let currentGp = record2?.data?.gp || 0;
        let currentPp = record2?.data?.pp || 0;

        if (redistributeGold) {
          // Convert everything to copper for easier calculation
          // 1 pp = 1000 cp, 1 gp = 100 cp, 1 sp = 10 cp
          const totalCurrentInCp =
            currentCp + currentSp * 10 + currentGp * 100 + currentPp * 1000;
          const totalDeductInCp =
            deductCp + deductSp * 10 + deductGp * 100 + deductPp * 1000;

          if (totalDeductInCp > totalCurrentInCp) {
            api.showNotification(
              "Not enough currency!",
              "red",
              "Not Enough Currency",
            );
            return;
          }

          // Calculate remaining copper and convert back to denominations
          let remainingCp = totalCurrentInCp - totalDeductInCp;

          // Convert back to highest denominations first
          const newPp = Math.floor(remainingCp / 1000);
          remainingCp = remainingCp % 1000;

          const newGp = Math.floor(remainingCp / 100);
          remainingCp = remainingCp % 100;

          const newSp = Math.floor(remainingCp / 10);
          remainingCp = remainingCp % 10;

          const newCp = remainingCp;

          api.setValues(
            {
              "data.cp": newCp,
              "data.sp": newSp,
              "data.gp": newGp,
              "data.pp": newPp,
              "data.deductCp": "",
              "data.deductSp": "",
              "data.deductGp": "",
              "data.deductPp": "",
              "data.redistributeGold": false,
            },
            updateCoinage,
          );
        } else {
          // Check if character has enough of each specific coin type
          const shortages = [];
          if (deductCp > currentCp) {
            shortages.push(`${deductCp - currentCp} CP`);
          }
          if (deductSp > currentSp) {
            shortages.push(`${deductSp - currentSp} SP`);
          }
          if (deductGp > currentGp) {
            shortages.push(`${deductGp - currentGp} GP`);
          }
          if (deductPp > currentPp) {
            shortages.push(`${deductPp - currentPp} PP`);
          }

          if (shortages.length > 0) {
            api.showNotification(
              `Not enough coins! Short: ${shortages.join(", ")}. Enable "Redistribute" to convert currency.`,
              "red",
              "Not Enough Coins",
            );
            return;
          }

          // Subtract exact amounts
          api.setValues(
            {
              "data.cp": currentCp - deductCp,
              "data.sp": currentSp - deductSp,
              "data.gp": currentGp - deductGp,
              "data.pp": currentPp - deductPp,
              "data.deductCp": "",
              "data.deductSp": "",
              "data.deductGp": "",
              "data.deductPp": "",
              "data.redistributeGold": false,
            },
            updateCoinage,
          );
        }
        api.closeOpenedPopovers();
      });
    }, 300);
  }

  // Toggle between the row list and the grid of item tiles. The column-header
  // row only makes sense for rows, so hide it in grid mode.
  function onViewModeChange() {
    const mode = api.getValue("data.inventoryViewMode") || "rows";
    const headerFields = api.getValue("fields.listHeaderRow") || {};
    api.setValues({
      "fields.listHeaderRow": { ...headerFields, hidden: mode === "grid" },
    });
  }

  // "Use" an inventory item from the grid popover. Delegates to the shared
  // useInventoryItem (commonScript) so the grid and the item-row Use button run
  // identical logic. `index` comes from the grid's celluse data context.
  function useGridItem(index) {
    useInventoryItem("data.inventory." + index);
  }

  // Invest / divest an item from the grid popover. Sets data.invested (string
  // "true"/"false", matching the row's invested iconbutton) then re-runs the
  // character recalc, exactly like the row's onItemInvested().
  function investGridItem(index, invested) {
    const itemDataPath = "data.inventory." + index;
    const newValue = invested ? "true" : "false";
    // More than 10 invested items: a warning (inventory-tools.js)
    const warning = getInvestmentWarning(record, api.getValue(itemDataPath), newValue);
    if (warning) {
      api.showNotification(warning, "yellow", "Investiture");
    }
    api.setValue(itemDataPath + ".data.invested", newValue, function () {
      // Same stale-snapshot problem as equipGridItem — investiture gates a
      // magic item's bonuses, so the recalc has to see the new state rather
      // than the one this callback's `record` snapshot still holds.
      syncInventoryItemValue(itemDataPath, "invested", newValue);
      onAddEditFeature(record, undefined, true);
    });
  }

  // Equip/carry/drop from the grid: set the state, then run the shared equip
  // handler (commonScript) so bulk, field visibility and recalc match the row's
  // carried dropdown.
  function equipGridItem(index, newValue) {
    const itemDataPath = "data.inventory." + index;
    api.setValue(itemDataPath + ".data.carried", newValue, function () {
      // The in-memory `record` this script closes over is a snapshot — unlike a
      // component onchange (which re-renders against a fresh one), this callback
      // still sees the PREVIOUS carried state, so total bulk and AC would land one step
      // behind: still counting the item just unequipped, or missing the one just
      // equipped. Mirror the new value across before handing off.
      syncInventoryItemValue(itemDataPath, "carried", newValue);
      onItemEquippedFor(itemDataPath, newValue);
    });
  }

  // Zero-arg grid action wrappers — the state string lives here (JS), not in the
  // cellactions JSON, so the attribute needs no nested quotes.
  function gridEquip(index) {
    equipGridItem(index, "equipped");
  }
  function gridCarry(index) {
    equipGridItem(index, "carried");
  }
  function gridDrop(index) {
    equipGridItem(index, "dropped");
  }
  function gridInvest(index) {
    investGridItem(index, true);
  }
  function gridDivest(index) {
    investGridItem(index, false);
  }
  function gridSell(index) {
    sellInventoryItem("data.inventory." + index);
  }
</script>
