<script>
  function getFormulaIndex() {
    const itemDataPath = getNearestParentDataPath(dataPath);
    return parseInt(itemDataPath.split(".").pop(), 10);
  }

  function onFormulaRowLoad() {
    // Show Grow when Nature Crafting is on, and Prepare for alchemists on
    // alchemical consumables
    const itemDataPath = getNearestParentDataPath(dataPath);
    const item = api.getValue(itemDataPath);
    const hideGrow = !getCraftingOptions().grow;
    const hidePrepare = !(
      getAlchemistClass(record) &&
      itemHasTrait(item, "alchemical") &&
      isConsumableItem(item)
    );
    const valuesToSet = {};
    if (item?.fields?.growBtn?.hidden !== hideGrow) {
      valuesToSet[`${itemDataPath}.fields.growBtn.hidden`] = hideGrow;
    }
    if (item?.fields?.prepareBtn?.hidden !== hidePrepare) {
      valuesToSet[`${itemDataPath}.fields.prepareBtn.hidden`] = hidePrepare;
    }
    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onCraftItem() {
    startCraftProject(record._id, getFormulaIndex(), "craft");
  }

  function onGrowItem() {
    startCraftProject(record._id, getFormulaIndex(), "grow");
  }

  function onPrepareItem() {
    prepareAdvancedAlchemy(record._id, getFormulaIndex());
  }

  function onQuantityChange() {
    // Consumables craft in batches of up to 4 (8 alchemical with Efficient
    // Alchemy); ammunition in its listed bundle
    const itemDataPath = getNearestParentDataPath(dataPath);
    const item = api.getValue(itemDataPath);
    const craftable = getCraftableItem(item);
    const batch = getCraftBatch(
      craftable,
      item.data?.craftingQuantity,
      getCraftBatchMax(record, craftable),
    );
    const valuesToSet = {
      [`${itemDataPath}.data.craftingCost`]: formatCp(batch.priceCp),
    };
    if (batch.quantity !== item.data?.craftingQuantity) {
      valuesToSet[`${itemDataPath}.data.craftingQuantity`] = batch.quantity;
    }
    api.setValues(valuesToSet);
  }
</script>

<div style="height: 30px; display: flex; gap: 4px; align-items: center">
  <div style="width: 30px; min-width: 30px">
    <portrait width="30px" height="30px" name="portrait"></portrait>
  </div>
  <div style="flex-grow: 1">
    <namefield
      size="xs"
      variant="standard"
      placeholder="Item"
      field="namefield"
    ></namefield>
  </div>
  <div
    style="
      width: 40px;
      border-bottom: 1px solid var(--mantine-color-default-border);
    "
  >
    <numberfield
      size="xs"
      width="100%"
      variant="unstyled"
      textalign="center"
      field="craftingDC"
      hidecontrols="true"
      placeholder="0"
      onload="onFormulaRowLoad()"
    >
    </numberfield>
  </div>
  <div style="width: 60px">
    <stringfield
      size="xs"
      width="100%"
      variant="tooltip-underline"
      textalign="center"
      label="Price of the batch"
      field="craftingCost"
      editable="false"
      placeholder="0 gp"
    >
    </stringfield>
  </div>
  <div style="width: 50px">
    <numberfield
      size="xs"
      width="100%"
      variant="tooltip"
      label="Quantity"
      minvalue="1"
      maxvalue="8"
      field="craftingQuantity"
      onchange="onQuantityChange()"
      placeholder="1"
    >
    </numberfield>
  </div>
  <div
    style="
      width: 150px;
      flex-shrink: 0;
      display: flex;
      gap: 2px;
      align-items: center;
      justify-content: flex-end;
    "
  >
    <iconbutton
      size="md"
      variant="default"
      field="growBtn"
      hidden="true"
      icon="IconPlant"
      options='[{"label": "Grow (Nature Crafting)", "value": "grow", "icon": "IconPlant"}]'
      onclick="onGrowItem()"
    ></iconbutton>
    <iconbutton
      size="md"
      variant="default"
      field="prepareBtn"
      hidden="true"
      icon="IconFlask"
      options='[{"label": "Prepare with Advanced Alchemy", "value": "prepare", "icon": "IconFlask"}]'
      onclick="onPrepareItem()"
    ></iconbutton>
    <div style="width: 80px; flex-shrink: 0">
      <button
        size="xs"
        variant="light"
        color="tertiary"
        field="craftingDeleteBtn"
        icon="IconHammer"
        label="Craft"
        width="100%"
        onclick="onCraftItem()"
      ></button>
    </div>
  </div>
</div>
