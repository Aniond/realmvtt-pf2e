<script>
  function onMarkCrafted(value) {
    const itemDataPath = getNearestParentDataPath(dataPath);

    // value is the option the button showed when clicked, which is also the
    // value the button cycles from. Write the button's next value with the
    // strikethrough in one call, so the two writes agree and neither snaps
    // back, even on a row an earlier version left out of sync.
    const crafted = value === "unmarkCrafted";
    api.setValues({
      [`${itemDataPath}.data.craftingDeleteBtn`]: crafted ? "markCrafted" : "unmarkCrafted",
      [`${itemDataPath}.fields.markedNameBox.hidden`]: crafted,
      [`${itemDataPath}.fields.unmarkedNameBox.hidden`]: !crafted,
    });
  }

  function onQuantityChange() {
    // Default a missing or negative quantity to 1 and rebuild the label the
    // way the Crafting tab does (legacy alchemists count batches of 2)
    api.getRecord(record.recordType, record._id, (updatedRecord) => {
      const items = updatedRecord.data?.advancedAlchemyItems || [];
      const valuesToSet = {};

      items.forEach((item, index) => {
        if (item.data?.quantity === undefined || item.data?.quantity < 0) {
          valuesToSet[`data.advancedAlchemyItems.${index}.data.quantity`] = 1;
        }
      });

      valuesToSet["data.totalDailyCraftingLabel"] = getAdvancedAlchemyLabel(
        getAdvancedAlchemyAllowance(updatedRecord),
      );

      api.setValues(valuesToSet);
    });
  }
</script>

<div style="height: 30px; display: flex; gap: 4px; align-items: center">
  <div style="width: 30px; min-width: 30px">
    <portrait width="30px" height="30px" name="portrait"></portrait>
  </div>
  <div style="flex-grow: 1">
    <box field="unmarkedNameBox">
      <label field="namefield" size="sm" variant="bold"></label>
    </box>
    <box field="markedNameBox" hidden="true">
      <div style="text-decoration: line-through; width: fit-content">
        <label field="namefield" size="sm" variant="bold"></label>
      </div>
    </box>
  </div>
  <div style="width: 50px">
    <numberfield
      size="xs"
      width="100%"
      variant="tooltip"
      label="Quantity"
      minvalue="0"
      field="quantity"
      onchange="onQuantityChange()"
      placeholder="0"
    >
    </numberfield>
  </div>
  <iconbutton
    size="md"
    variant="default"
    field="craftingDeleteBtn"
    icon="IconHammer"
    options='[{"label": "Mark Crafted", "value": "markCrafted", "icon": "IconHammer"},
    {"label": "Unmark Crafted", "value": "unmarkCrafted", "icon": "IconHammerOff"}]'
    onclick="onMarkCrafted(value)"
  ></iconbutton>
</div>
