<script>
  function rollInitiative() {
    // Roll initiative for the character
    performInitiativeRoll(record);
  }

  function onAddSpellcastingEntry() {
    addSpellcastingEntry(record);
    api.closeOpenedPopovers();
  }

  // Makes the class's spellcasting entries the player deleted again
  function onRestoreSpellcastingEntries() {
    api.closeOpenedPopovers();
    const oldSpells = record.data?.spells || [];
    api.setValues(
      { "data.spellcastingDismissed": [], "data.autoSpellcasting": true },
      (updatedRecord) => {
        onAddEditFeature(
          updatedRecord,
          () => {
            api.getRecord("characters", record._id, (syncedRecord) => {
              const message = describeAddedSpellcastingEntries(
                oldSpells,
                syncedRecord
              );
              if (message) {
                api.showNotification(message, "blue", "Spellcasting");
              }
            });
          },
          true
        );
      }
    );
  }

  function onAddAction() {
    api.getRecord("characters", record._id, (updatedRecord) => {
      onAddEditFeature(updatedRecord);
    });
  }
</script>

  <!-- ===== ATTACKS SECTION ===== -->

    <span class="rvtt-sheet-corner rvtt-sheet-corner--br"></span>

    <div class="rvtt-sheet-divider">

            <button

            <!-- Shown once an entry the class made was deleted -->
            <button

          </div>

      </popover>
    </div>
  </div>
