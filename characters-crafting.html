<script>
  function onDrop(value, recordLink) {
    if (value === "items") {
      onDropItem(recordLink);
    }
  }

  // Dropping an item adds its formula: already known, bought or copied, or
  // reverse-engineered from an item you have
  function onDropItem(recordLink) {
    const item = recordLink?.value;
    if (item) {
      promptAddFormula(record._id, item);
    }
  }

  function onCraftingTabLoad() {
    // Show the Treasure Vault crafting options the campaign uses, and which
    // Craft rules apply
    const options = getCraftingOptions();
    const hasSalvage = (record.data?.craftingSalvage || []).length > 0;
    const extras = [
      options.complexCrafting ? "Complex Crafting" : "",
      options.criticalCrafting ? "Critical Crafting" : "",
      options.deconstruct ? "Converting Magic Items" : "",
      options.grow ? `Nature Crafting (Grow with ${options.grow === "nature" ? "Nature" : "Crafting"})` : "",
      options.downtimeEvents ? "Downtime Events" : "",
    ].filter((name) => name);
    const rules =
      getCraftingRulesVersion() === "legacy"
        ? "Craft rules: Legacy (Core Rulebook). The formula is required; setup takes 4 days."
        : "Craft rules: Remaster (Player Core). Setup takes 2 days, or 1 with the formula.";
    const label = extras.length > 0 ? `${rules} Treasure Vault: ${extras.join(", ")}.` : rules;

    const valuesToSet = {};
    const setIfChanged = (path, value, current) => {
      if (current !== value) valuesToSet[path] = value;
    };
    setIfChanged("data.craftingRulesLabel", label, record.data?.craftingRulesLabel);
    setIfChanged(
      "fields.salvageBox.hidden",
      !(options.deconstruct || hasSalvage),
      record.fields?.salvageBox?.hidden,
    );
    setIfChanged(
      "fields.deconstructBtn.hidden",
      !options.deconstruct,
      record.fields?.deconstructBtn?.hidden,
    );
    setIfChanged(
      "fields.downtimeEventBtn.hidden",
      !options.downtimeEvents,
      record.fields?.downtimeEventBtn?.hidden,
    );
    setIfChanged(
      "data.totalDailyCraftingLabel",
      getAdvancedAlchemyLabel(getAdvancedAlchemyAllowance(record)),
      record.data?.totalDailyCraftingLabel,
    );
    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onShowAdvancedAlchemy(value) {
    const allowance = getAdvancedAlchemyAllowance(record);
    api.setValues({
      "fields.advancedAlchemyBox.hidden": !value,
      "data.numDailyCrafting": allowance.limit,
      "data.totalDailyCraftingLabel": getAdvancedAlchemyLabel(allowance),
    });
  }

  function performDailyCrafting() {
    // Make the prepared Advanced Alchemy items: copy each one not yet made into
    // the inventory with the infused trait. The daily limit is 4 + Int items
    // (remaster), or level + Int batches of infused reagents, each making 2 of
    // one item (legacy).
    const allowance = getAdvancedAlchemyAllowance(record);
    if (allowance.used > allowance.limit) {
      api.showNotification(
        `${getAdvancedAlchemyLabel(allowance)}. Lower the quantities first.`,
        "red",
        "Crafting"
      );
      return;
    }

    let totalCrafted = 0;

    const items = record.data?.advancedAlchemyItems || [];
    const valuesToSet = {};
    const itemsToAdd = [];

    items.forEach((item, index) => {
      const itemDataPath = `data.advancedAlchemyItems.${index}`;

      if (
        item.data?.craftingDeleteBtn !== "unmarkCrafted" &&
        item.data?.quantity &&
        item.data?.quantity > 0
      ) {
        valuesToSet[`${itemDataPath}.data.craftingDeleteBtn`] = "unmarkCrafted";
        valuesToSet[`${itemDataPath}.fields.markedNameBox.hidden`] = false;
        valuesToSet[`${itemDataPath}.fields.unmarkedNameBox.hidden`] = true;
        totalCrafted += item.data?.quantity;
        itemsToAdd.push({
          ...item,
          _id: generateUuid(),
          data: {
            ...item.data,
            ammo: item.data?.quantity,
            count: item.data?.quantity,
            carried: "carried",
            // Items mark as infused disappear after a long rest
            traits: [...(item.data?.traits || []), "infused"],
            traitsList: [
              ...(item.data?.traitsList || []),
              {
                _id: generateUuid(),
                name: "Infused",
                identified: true,
                data: {},
              },
            ],
          },
          fields: {
            ...item.fields,
            ...getItemFields(item),
          },
        });
      }
    });

    if (Object.keys(valuesToSet).length > 0 && totalCrafted > 0) {
      api.showNotification(
        `${totalCrafted} items successfully crafted and added to your inventory.`,
        "green",
        "Crafting"
      );
      api.setValues(valuesToSet, (record) => {
        api.addValues("data.inventory", itemsToAdd);
      });
    } else {
      api.showNotification(
        `No items were crafted, none were prepared or marked as not already crafted.`,
        "yellow",
        "Crafting"
      );
    }
  }

  function onNumDailyCraftingChange(value) {
    // A manual daily limit (for feats that change it)
    const allowance = {
      ...getAdvancedAlchemyAllowance(record),
      limit: parseInt(value, 10) || 0,
    };
    api.setValues({
      "data.totalDailyCraftingLabel": getAdvancedAlchemyLabel(allowance),
    });
  }

  function onAdvancedAlchemyItemChange() {
    // Recalc the totals for advanced alchemy items
    // Requery the record
    api.getRecord(record.recordType, record._id, (updatedRecord) => {
      const items = updatedRecord.data?.advancedAlchemyItems || [];
      const valuesToSet = {};

      items.forEach((item, index) => {
        if (item.data?.quantity === undefined || item.data?.quantity < 0) {
          valuesToSet[`data.advancedAlchemyItems.${index}.data.quantity`] = 1;
        }
      });

      const allowance = {
        ...getAdvancedAlchemyAllowance(updatedRecord),
        limit:
          updatedRecord.data?.numDailyCrafting ??
          getAdvancedAlchemyAllowance(updatedRecord).limit,
      };
      valuesToSet["data.totalDailyCraftingLabel"] =
        getAdvancedAlchemyLabel(allowance);

      api.setValues(valuesToSet);
    });
  }

  function resetDailyCrafting() {
    // Reset the daily crafting for the character
    // Go through each item and unmark cradted
    const items = record.data?.advancedAlchemyItems || [];
    const valuesToSet = {};
    items.forEach((item, index) => {
      const itemFieldsPath = `data.advancedAlchemyItems.${index}.fields`;
      const itemDataPath = `data.advancedAlchemyItems.${index}.data`;
      valuesToSet[`${itemDataPath}.craftingDeleteBtn`] = "markCrafted";
      valuesToSet[`${itemFieldsPath}.markedNameBox.hidden`] = true;
      valuesToSet[`${itemFieldsPath}.unmarkedNameBox.hidden`] = false;
    });

    if (Object.keys(valuesToSet).length > 0) {
      api.setValues(valuesToSet);
    }
  }

  function onDeconstruct() {
    promptDeconstruct(record._id);
  }

  function onRollDowntimeEvent() {
    rollCraftingDowntimeEvent();
  }
</script>

<div class="sheet--spread">
  <div
    class="rvtt-sheet-section rvtt-sheet-corners"
    style="background: var(--bg, transparent)"
  >
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--tr"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--bl"></span>
    <span class="rvtt-sheet-corner rvtt-sheet-corner--br"></span>

    <div class="rvtt-sheet-divider">
      <span class="rvtt-sheet-divider__label">&#10022; Crafting &#10022;</span>
    </div>

    <div style="width: 100%">
      <div style="float: right">
        <checkbox

    <label

      size="xs"
      width="100%"
      textalign="left"
      color="dimmed"

    <box field="advancedAlchemyBox" hidden="true">
      <div
        style="
          display: flex;
          flex-direction: row;
          width: 100%;
          gap: 4px;
          background-color: rgb(
            from var(--mantine-color-primary-filled) r g b / 0.25
          );
          border-radius: 4px;
          padding: 0px 4px;
          margin-top: 8px;
        "
      >
        <label
          class="rvtt-sheet-label rvtt-sheet-label--accent"
          label="Advanced Alchemy"
        ></label>
      </div>

      <div style="height: 30px; display: flex; gap: 4px; align-items: center">
        <div style="width: 30px; min-width: 30px"></div>
        <div style="flex-grow: 1"></div>
        <div style="width: 50px">
          <label
            class="rvtt-sheet-label"
            width="100%"
            textalign="center"
            label="Quantity"
          >
          </label>
        </div>
        <div style="width: 30px"></div>
        <box field="tableSpacer" width="16px" hideonlocked="true"></box>
      </div>

      <list
        listtype="advanced_alchemy_list"
        onchange="onAdvancedAlchemyItemChange()"
        variant="striped-outline"
        field="advancedAlchemyItems"
      ></list>

      <div style="margin-top: 4px">
        <label
          size="xs"
          width="100%"
          textalign="left"
          field="totalDailyCraftingLabel"
          color="dimmed"
        >
        </label>
      </div>

      <div
        style="
          height: 30px;
          display: flex;
          gap: 4px;
          align-items: center;
          margin-top: 4px;
        "
      >
        <button
          size="xs"
          variant="light"
          field="performCraftingBtn"
          icon="IconHammer"
          label="Perform Daily Crafting"
          onclick="performDailyCrafting()"
        ></button>

        <button
          size="xs"
          variant="default"
          field="resetCraftingBtn"
          icon="IconRefresh"
          label="Reset Crafting"
          onclick="resetDailyCrafting()"
        ></button>

        <div style="width: 8px"></div>

        <label
          class="rvtt-sheet-label"
          width="60px"
          textalign="center"
          label="# / Day"
        >
        </label>

        <numberfield
          size="xs"
          field="numDailyCrafting"
          label="Number per Day"
          onchange="onNumDailyCraftingChange(value)"
          variant="tooltip"
          placeholder="0"
          width="60px"
          minvalue="0"
          maxvalue="100"
        ></numberfield>
      </div>
    </box>

    <div
      style="
        display: flex;
        flex-direction: row;
        width: 100%;
        background-color: rgb(
          from var(--mantine-color-tertiary-filled) r g b / 0.25
        );
        border-radius: 4px;
        padding: 0px 4px;
        margin-top: 8px;
      "
    >
      <label
        class="rvtt-sheet-label rvtt-sheet-label--accent"
        field="knownFormulasLabel"
        label="Formula Book"
      ></label>
    </div>

    <div style="height: 30px; display: flex; gap: 4px; align-items: center">
      <div style="width: 30px; min-width: 30px"></div>
      <div style="flex-grow: 1"></div>
      <div style="width: 40px">
        <label
          class="rvtt-sheet-label"
          width="100%"
          textalign="center"
          label="DC"
        >
        </label>
      </div>
      <div style="width: 60px">
        <label
          class="rvtt-sheet-label"
          width="100%"
          textalign="center"
          label="Price"
        >
        </label>
      </div>
      <div style="width: 50px">
        <label
          class="rvtt-sheet-label"
          width="100%"
          textalign="center"
          label="Quantity"
        >
        </label>
      </div>
      <div style="width: 90px"></div>
      <box field="tableSpacer" width="16px" hideonlocked="true"></box>
    </div>

    <list
      listtype="crafting_list"
      variant="striped-outline"
      keepitemondrag="true"
      field="craftingItems"
    ></list>

    <div
      style="
        display: flex;
        flex-direction: row;
        width: 100%;
        background-color: rgb(
          from var(--mantine-color-secondary-filled) r g b / 0.25
        );
        border-radius: 4px;
        padding: 0px 4px;
        margin-top: 8px;
      "
    >
      <label
        class="rvtt-sheet-label rvtt-sheet-label--accent"
        label="Crafting Projects"
      ></label>
    </div>

    <list
      listtype="crafting_project_list"
      variant="striped-outline"
      field="craftingProjects"
    ></list>

    <box field="salvageBox" hidden="true">
      <div
        style="
          display: flex;
          flex-direction: row;
          width: 100%;
          background-color: rgb(
            from var(--mantine-color-orange-filled) r g b / 0.25
          );
          border-radius: 4px;
          padding: 0px 4px;
          margin-top: 8px;
        "
      >
        <label
          class="rvtt-sheet-label rvtt-sheet-label--accent"
          label="Salvaged Parts"
        ></label>
      </div>

      <list
        listtype="crafting_salvage_list"
        variant="striped-outline"
        field="craftingSalvage"
      ></list>
    </box>

    <div style="display: flex; gap: 4px; margin-top: 8px">
      <button
        size="xs"
        variant="light"
        field="deconstructBtn"
        hidden="true"
        icon="IconTools"
        label="Deconstruct an Item"
        onclick="onDeconstruct()"
      ></button>
      <button
        size="xs"
        variant="default"
        field="downtimeEventBtn"
        hidden="true"
        icon="IconDice"
        label="Roll Downtime Event"
        onclick="onRollDowntimeEvent()"
      ></button>
    </div>
  </div>
</div>
